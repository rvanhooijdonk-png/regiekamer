<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Regiekamer — peilbord</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --grond:#f3f4f2;--plaat:#fff;--plaat2:#eaedea;--rand:#d3d8d4;--rand-zacht:#e3e7e3;
  --inkt:#161c19;--inkt-zacht:#4f5b55;--inkt-stil:#7f8a84;
  --groen:#1f8a5a;--amber:#b7791f;--rood:#c53a44;--blauw:#2f6fd1;--paars:#6b4fa8;
  --groen-vlak:#e3f3ea;--amber-vlak:#fbf1de;--rood-vlak:#fbe9ea;--blauw-vlak:#e6eefb;--geel-vlak:#fff4d6;
  --schaduw:0 1px 2px rgba(20,30,25,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --grond:#0d1117;--plaat:#151b23;--plaat2:#1b232d;--rand:#232c38;--rand-zacht:#1b232d;
  --inkt:#e4e9f0;--inkt-zacht:#8b98a9;--inkt-stil:#5d6a7b;
  --groen:#3fb27f;--amber:#d99b3d;--rood:#e05561;--blauw:#6aa0ff;--paars:#a98cdd;
  --groen-vlak:#0f2a1e;--amber-vlak:#2a2112;--rood-vlak:#2a1519;--blauw-vlak:#132036;--geel-vlak:#2e2410;
  --schaduw:none;
}}
:root[data-theme="dark"]{
  --grond:#0d1117;--plaat:#151b23;--plaat2:#1b232d;--rand:#232c38;--rand-zacht:#1b232d;
  --inkt:#e4e9f0;--inkt-zacht:#8b98a9;--inkt-stil:#5d6a7b;
  --groen:#3fb27f;--amber:#d99b3d;--rood:#e05561;--blauw:#6aa0ff;--paars:#a98cdd;
  --groen-vlak:#0f2a1e;--amber-vlak:#2a2112;--rood-vlak:#2a1519;--blauw-vlak:#132036;--geel-vlak:#2e2410;
  --schaduw:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--grond);color:var(--inkt);
  font:14px/1.45 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- kopbalk ---------- */
header{position:sticky;top:0;z-index:9;background:var(--plaat);border-bottom:1px solid var(--rand);box-shadow:var(--schaduw)}
.kop{max-width:1280px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lamp{width:13px;height:13px;border-radius:50%;flex:none;background:var(--inkt-stil)}
.lamp.groen{background:var(--groen);box-shadow:0 0 0 4px var(--groen-vlak)}
.lamp.amber{background:var(--amber);box-shadow:0 0 0 4px var(--amber-vlak)}
.lamp.rood{background:var(--rood);box-shadow:0 0 0 4px var(--rood-vlak)}
@media (prefers-reduced-motion:no-preference){.lamp.rood{animation:puls 2.4s ease-in-out infinite}}
@keyframes puls{50%{box-shadow:0 0 0 8px var(--rood-vlak)}}
h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
.versheid{font-size:12px;color:var(--inkt-zacht)}
.versheid.rood{color:var(--rood);font-weight:600}
.tellers{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.teller{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--rand);background:var(--plaat2);white-space:nowrap}
.teller b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.teller.rood{background:var(--rood-vlak);border-color:var(--rood);color:var(--rood)}
.teller.amber{background:var(--amber-vlak);border-color:var(--amber);color:var(--amber)}
.teller.blauw{background:var(--blauw-vlak);border-color:var(--blauw);color:var(--blauw)}
.teller.geel{background:var(--geel-vlak);border-color:var(--amber);color:var(--inkt)}

/* ---------- layout ---------- */
main{max-width:1280px;margin:0 auto;padding:18px 20px 70px;display:grid;gap:20px}
section{background:var(--plaat);border:1px solid var(--rand);border-radius:7px;overflow:hidden}
section.urgent{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-vlak)}
.kopje{padding:9px 14px;border-bottom:1px solid var(--rand);background:var(--plaat2);
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.kopje h2{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--inkt-zacht);margin:0}
.kopje .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--inkt);font-weight:600}
.kopje .bron{font-size:11px;color:var(--inkt-stil);margin-left:auto;text-align:right}

table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--inkt-stil);font-weight:500;
  text-align:left;padding:6px 14px;border-bottom:1px solid var(--rand-zacht);white-space:nowrap}
td{padding:8px 14px;border-bottom:1px solid var(--rand-zacht);vertical-align:top;overflow-wrap:anywhere}
tbody tr:last-child td{border-bottom:0}
td.mono,th.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12.5px}
td.nr{color:var(--inkt-stil);text-align:right;width:3ch}
td.strak{white-space:nowrap}

.pil{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;
  font-family:"IBM Plex Mono",monospace}
.pil.bezig{background:var(--blauw-vlak);color:var(--blauw)}
.pil.vrij,.pil.klaar{background:var(--groen-vlak);color:var(--groen)}
.pil.vast,.pil.geblokkeerd{background:var(--rood-vlak);color:var(--rood)}
.pil.stil,.pil.stale{background:var(--amber-vlak);color:var(--amber)}
.pil.wacht,.pil.open{background:var(--plaat2);color:var(--inkt-zacht)}
.pil.hoog{background:var(--rood-vlak);color:var(--rood)}
.pil.middel{background:var(--amber-vlak);color:var(--amber)}
.pil.laag{background:var(--plaat2);color:var(--inkt-zacht)}
.pil.goed{background:var(--groen-vlak);color:var(--groen)}
.pil.slecht{background:var(--rood-vlak);color:var(--rood)}
.pil.onleesbaar{background:var(--amber-vlak);color:var(--amber)}
.pil.ja{background:var(--blauw-vlak);color:var(--blauw)}
.pil.nee{background:var(--plaat2);color:var(--inkt-stil)}
tr.rij-vast td:first-child,tr.rij-geblokkeerd td:first-child{box-shadow:inset 3px 0 0 var(--rood)}
tr.rij-stil td:first-child,tr.rij-stale td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
tr.rij-bezig td:first-child{box-shadow:inset 3px 0 0 var(--blauw)}
tr.rij-klaar td:first-child{box-shadow:inset 3px 0 0 var(--groen)}

/* ---------- de centrale takenlijst ---------- */
/* Richard, 2026-09-09: "Mijn voorkeur is een centrale takenlijst, zodat ik daar ook
   kan zien wat geblokkeerd is, wat vast zit." Daarom is dit ÉÉN tabel met fase-koppen
   erin, geen vier aparte blokken die je naast elkaar moet leggen. */
tr.fase td{background:var(--plaat2);border-bottom:1px solid var(--rand);padding:7px 14px}
tr.fase b{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--inkt-zacht)}
tr.fase span.tel{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--inkt-stil);margin-left:8px}
td.taak{font-weight:500;min-width:16ch}
.actie{color:var(--inkt-zacht);font-size:12.5px;line-height:1.4}
.duur.lang{color:var(--amber);font-weight:600}
.duur.zeerlang{color:var(--rood);font-weight:600}

.besluit{font-weight:500}
.besluit .kost{display:inline-block;font-size:11px;color:var(--inkt-stil);font-family:"IBM Plex Mono",monospace}
.ontgrendelt{color:var(--inkt-zacht);font-size:12.5px}
.ontgrendelt::before{content:"⤷ ";color:var(--inkt-stil)}

/* ---------- analyse ---------- */
section.analyse .kopje{border-bottom:0}
.oordeel{padding:2px 16px 16px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.stempel{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;letter-spacing:.06em;
  padding:7px 14px;border-radius:6px;white-space:nowrap;flex:none}
.stempel.positief{background:var(--groen-vlak);color:var(--groen)}
.stempel.gemengd{background:var(--blauw-vlak);color:var(--blauw)}
.stempel.zorgelijk{background:var(--amber-vlak);color:var(--amber)}
.stempel.slecht{background:var(--rood-vlak);color:var(--rood)}
.stempel.no_data{background:var(--plaat2);color:var(--inkt-stil)}
.oordeel p{margin:5px 0 0;font-size:14.5px;line-height:1.5;flex:1 1 320px;min-width:0}
.gronden{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 16px}
.grond{font-size:12px;padding:5px 10px;border-radius:5px;border:1px solid var(--rand);background:var(--plaat2);
  display:flex;gap:7px;align-items:baseline}
.grond b{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px}
.grond.slecht{background:var(--rood-vlak);border-color:var(--rood);color:var(--rood)}
.grond.let_op{background:var(--amber-vlak);border-color:var(--amber);color:var(--amber)}
.grond.goed{background:var(--groen-vlak);border-color:var(--groen);color:var(--groen)}

.verouderd{padding:9px 14px;background:var(--amber-vlak);color:var(--amber);font-size:12.5px;line-height:1.45;
  border-bottom:1px solid var(--rand-zacht)}
.leeg{padding:20px 14px;color:var(--inkt-stil);font-size:13px;text-align:center}
footer{max-width:1280px;margin:0 auto;padding:0 20px 40px;font-size:11.5px;color:var(--inkt-stil);line-height:1.7}
footer code{font-family:"IBM Plex Mono",monospace;background:var(--plaat2);padding:1px 5px;border-radius:3px}
footer a{color:var(--blauw)}
.fout{margin:20px;padding:14px;border:1px solid var(--rood);background:var(--rood-vlak);color:var(--rood);border-radius:6px}
.geenbron{padding:14px;color:var(--amber);background:var(--amber-vlak);font-size:12.5px;line-height:1.5}
</style>
</head>
<body>

<header>
  <div class="kop">
    <div class="lamp" id="lamp"></div>
    <h1>Regiekamer — peilbord</h1>
    <div class="versheid mono" id="versheid">laden…</div>
    <div class="tellers" id="tellers"></div>
  </div>
</header>

<main id="main">
  <div class="leeg" id="laadmelding">Data ophalen…</div>
</main>

<footer id="voet"></footer>

<script>
const BRON = "../regiekamer.json";
const VERVERS_MS = 60000;
// Richard, 2026-09-09: "enkele 'gerede' taken zien, maximaal 2/3 per update."
// Harde bovengrens op wat er van het afgeronde werk getoond wordt.
const MAX_KLAAR = 3;
const el = (id) => document.getElementById(id);
// String() en Number() roepen toString/valueOf van de bronwaarde aan. JSON.parse
// kan {"toString":null} opleveren — dan gooit die conversie een TypeError, en één
// throw sloopt de hele render, niet alleen die ene cel. Elke bronwaarde wordt
// daarom eerst op type getoetst: wat geen primitieve waarde is, telt als afwezig.
const prim = (v) => (typeof v === "string" || typeof v === "number" || typeof v === "boolean") ? v : "";
// Ook de enkele quote wordt ontsnapt. In dit sjabloon staat vandaag geen enkel
// attribuut in enkele quotes, dus het is nu niet uitbuitbaar — maar dan hangt de
// veiligheid van esc() af van hoe een latere regel toevallig geschreven wordt, en
// dat is geen veiligheid. Reviewbevinding, ronde 4.
const esc = (s) => String(prim(s)).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// markdown-vet uit brondocumenten wegstrippen, geen HTML doorlaten
const schoon = (s) => esc(String(prim(s)).replace(/\*\*/g, "").trim());
// klassenaam uit brondata: alleen letters/cijfers/underscore, nooit een attribuutbreuk
const klasse = (s) => String(prim(s)).toLowerCase().replace(/[^a-z0-9_]/g, "");
// Een getal uit de JSON kan een string, null of onzin zijn. Alles wat gerekend of
// als breedte gebruikt wordt gaat hier eerst doorheen: liever een 0 dan een "NaN%"
// op het bord of een balk die het hele blok meesleept.
// Een boolean is géén getal, ook al maakt Number(true) er een 1 van: secTekst(true)
// toonde daardoor "<1 min" waar een streepje hoort. Alleen een echt getal of een
// string die een getal ís telt mee. Reviewbevinding, ronde 4.
const cijfer = (v) => typeof v === "number" ? v
  : (typeof v === "string" && v.trim() !== "" && Number.isFinite(Number(v))) ? Number(v) : null;
const getal = (v) => { const n = cijfer(v); return n !== null && Number.isFinite(n) ? n : 0; };
const isGetal = (v) => { const n = cijfer(v); return n !== null && Number.isFinite(n); };
// alles wat als lijst uit de JSON komt: geen null-gaten, geen losse waarden
const objecten = (v) => Array.isArray(v) ? v.filter(x => x && typeof x === "object") : [];

// Date.parse() en new Date() converteren hun argument net zo goed via toString als
// String() dat doet, dus een tijdstempel moet vóór conversie op type getoetst worden.
// prim() volstaat daar niet: dat laat getallen en booleans door, en `new Date(1)`
// levert dan doodleuk 1 januari 1970 op — een verzonnen tijd op het bord is erger
// dan een streepje. De bron levert ISO-tekst; wat geen tekst is, is geen tijdstempel.
const tijd = (v) => typeof v === "string" ? v.trim() : "";
function minGeleden(iso){
  const s = tijd(iso);
  if(!s) return null;
  const t = Date.parse(s);
  if(Number.isNaN(t)) return null;
  return (Date.now() - t) / 60000;
}
function duurTekst(min){
  if(!isGetal(min)) return "—";
  const m = Number(min);
  if(m < 1) return "<1 min";
  if(m < 90) return Math.round(m) + " min";
  const u = Math.floor(m/60), r = Math.round(m%60);
  return u + "u" + (r ? " " + r + "m" : "");
}
function secTekst(sec){
  return isGetal(sec) ? duurTekst(Number(sec)/60) : "—";
}
function klok(iso){
  const s = tijd(iso);
  if(!s) return "—";
  const d = new Date(s);
  if(Number.isNaN(+d)) return "—";
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

// Richard, 2026-09-09: "Grote problemen is veel te uitgebreid. Houd het simpel en
// gebruik teksten die ik kan begrijpen." De bron levert probleemteksten van 1700+
// tekens. Hier wordt daar één leesbare regel van: de eerste zin, en anders een
// afgekapte regel met een zichtbare … erachter. Die … is er met opzet — er wordt
// nooit iets ingekort zonder dat de lezer ziet dát er meer was.
// Deze aanhef staat letterlijk voor elke oplossingstekst in de bron en zegt de lezer
// niets nieuws — hij herhaalt zich elf keer onder elkaar. De informatie die erin zit
// ("jij hoeft niets te doen") staat al in de opgepakt-pil ernaast.
const RUIS = /^\s*(geen Richard-escalatie|geen escalatie|Richard-escalatie: nee)\s*[:;-]*\s*/i;
function kort(s, n){
  const grens = isGetal(n) ? Number(n) : 90;
  let t = String(prim(s)).replace(/\*\*/g, "").replace(/\s+/g, " ").replace(RUIS, "").trim();
  if(!t) return "";
  // Eerste hele zin, als die er is. "Astra-identificatie vs. de rest" mag daarbij niet
  // op "vs." breken: een punt achter een woord van hoogstens drie letters is een
  // afkorting, geen zinseinde.
  const zin = t.match(/^[^.!?]{24,}?[.!?](?=\s|$)/);
  if(zin && zin[0].length <= grens + 25 && !/(^|\s)\S{1,3}[.!?]$/.test(zin[0])) t = zin[0].trim();
  if(t.length <= grens) return esc(t);
  const knip = t.slice(0, grens);
  const spatie = knip.lastIndexOf(" ");
  return esc((spatie > grens * 0.6 ? knip.slice(0, spatie) : knip).trim()) + "…";
}

// Order-ids zijn machinetaal: DIRECTOR_STAP6REVIEW_951F90B8_20260909_CODEX1_V1.
// De hexadecimale hash, de datum en de versiestaart zeggen een lezer niets; de rest
// wel. Wat overblijft is de leesbare kern, in gewone kleine letters.
function leesbaar(s){
  const t = String(prim(s)).trim();
  if(!t) return "";
  if(!/^[A-Z0-9_]+$/.test(t)) return t;          // gewone tekst blijft gewone tekst
  const woorden = t.split(/_+/).filter(w =>
    w && !/^(?=.*\d)[0-9A-Fa-f]{6,}$/.test(w) && !/^\d{4,}$/.test(w) && !/^V\d+$/i.test(w)
      && !/^\d{3,4}Z$/i.test(w));   // 1108Z is een kloktijd in een id, geen woord
  return woorden.length ? woorden.join(" ").toLowerCase() : t.toLowerCase();
}

// één plek voor "die bron is er niet" — zonder bron toont het bord geen cijfer
function geenBron(blok, wat){
  if(!blok || typeof blok !== "object") return `<div class="geenbron">${esc(wat)} — dit veld staat niet in <code>regiekamer.json</code>.</div>`;
  const st = blok.status;
  if(st && st !== "OK") return `<div class="geenbron">${esc(wat)} — bron <code>${schoon(blok.bron_pad)}</code>: ${schoon(st)}.</div>`;
  return null;
}

function render(data){
  // Een lege of kapotte JSON is een bronfout, geen renderfout: het bord moet dat
  // melden en overeind blijven, niet halverwege een blok stukvallen.
  const d = (data && typeof data === "object" && !Array.isArray(data)) ? data : {};
  const lanes    = objecten(d.accounts);
  const events   = objecten(d.ticker_events);
  const beslis   = objecten(d.beslisrij?.items);
  // De generator geeft een beslisregel die hij niet kon lezen bewust letterlijk door
  // in plaats van hem weg te laten (R2). Toonde het bord alleen `items`, dan gooide de
  // renderlaag alsnog weg wat de generator juist had bewaard — en erger: een bord met
  // uitsluitend onleesbare regels meldde "Niets dat op jou wacht." Reviewbevinding, ronde 5.
  const beslisOnleesbaar = objecten(d.beslisrij?.onparseerbare_regels);
  const beslisTotaal = beslis.length + beslisOnleesbaar.length;
  const analyse  = d.analyse;
  const route    = d.route;
  const prob     = d.problemen;
  const werk     = d.werk;

  /* ---- versheid: de enige echte gezondheidsmeting van dit bord ---- */
  const oud = minGeleden(d.gegenereerd_op);
  const versKlasse = oud === null ? "" : (oud > 20 ? "rood" : oud > 10 ? "amber" : "groen");
  el("lamp").className = "lamp " + versKlasse;
  el("versheid").className = "versheid mono" + (versKlasse === "rood" ? " rood" : "");
  el("versheid").textContent = oud === null
    ? "geen tijdstempel in de data"
    : "data van " + klok(d.gegenereerd_op) + " · " + duurTekst(oud) + " oud"
      + (oud > 20 ? "  ⚠ de generator ververst niet meer" : "");

  const blokken = [];

  /* ---- 1. HOE STAAT DE STACK ERVOOR ---- */
  {
    const ontbreekt = geenBron(analyse, "Geen analyse");
    const oordeel = klasse(analyse?.oordeel) || "no_data";
    // objecten() en niet Array.isArray: één null in de lijst sloopte hieronder de
    // hele render op `g.richting`. Reviewbevinding, ronde 4.
    const gronden = objecten(analyse?.gronden);
    // Richard, "INSTRUCTIE AAN HET BOARD-TEAM" 2026-09-09, eindoordeel-punt: tel
    // bronnen (onderliggende oorzaken), niet losse gronden — "10 punten los gemeten
    // · 4 fout" weegt tien ongelijke dingen even zwaar terwijl vandaag alle rode
    // punten op één storing terugvoerden. hoofdoorzaken.bronnen_* is al zo geteld
    // in de generator (build_analyse); hier alleen dezelfde telling tonen i.p.v.
    // opnieuw over losse gronden tellen. Zonder hoofdoorzaken (oudere JSON) valt dit
    // terug op de oude, minder precieze grond-telling.
    const hoofdoorzaken = analyse?.hoofdoorzaken;
    const bronnenAlle = new Set(gronden.map(g => g.bron).filter(Boolean)).size;
    const nSlecht = hoofdoorzaken ? getal(hoofdoorzaken.bronnen_slecht?.length) : gronden.filter(g => g.richting === "SLECHT").length;
    const nLetOp  = hoofdoorzaken ? getal(hoofdoorzaken.bronnen_let_op?.length) : gronden.filter(g => g.richting === "LET_OP").length;
    const nTotaal = hoofdoorzaken && bronnenAlle ? bronnenAlle : gronden.length;
    const subtitelWoord = hoofdoorzaken && bronnenAlle ? "bronnen" : "punten los";
    blokken.push(`
    <section class="analyse${oordeel === "slecht" || oordeel === "zorgelijk" ? " urgent" : ""}">
      <div class="kopje"><h2>Hoe staat de stack ervoor</h2>
        <span class="bron">${nTotaal} ${subtitelWoord} gemeten ·
          ${nSlecht} fout, ${nLetOp} let op, ${Math.max(0, nTotaal - nSlecht - nLetOp)} goed</span></div>
      ${ontbreekt || `
      <div class="oordeel">
        <div class="stempel ${oordeel}">${schoon(analyse.oordeel)}</div>
        <p>${schoon(analyse.kop)}</p>
      </div>
      <div class="gronden">${gronden.map(g => `
        <span class="grond ${klasse(g.richting)}">${schoon(g.punt)} <b>${schoon(g.waarde)}</b></span>`).join("")}
      </div>`}
    </section>`);
  }

  /* ---- 2. WAT JIJ MOET BESLISSEN ---- */
  blokken.push(`
  <section class="${beslisTotaal ? "urgent" : ""}">
    <div class="kopje"><span class="n">${beslisTotaal}</span><h2>Wat jij moet beslissen</h2>
      <span class="bron">bron: ${schoon(d.beslisrij?.bron_pad || "—")}</span></div>
    ${geenBron(d.beslisrij, "Geen beslisrij") || (beslisTotaal ? `<table>
      <thead><tr><th class="mono">nr</th><th>Besluit</th><th>Kost</th><th>Ontgrendelt</th></tr></thead>
      <tbody>${beslis.map(b => `
        <tr><td class="nr mono">${schoon(b.nr)}</td>
        <td class="besluit">${schoon(b.besluit)}</td>
        <td class="mono strak">${schoon(b.kost)}</td>
        <td class="ontgrendelt">${schoon(b.ontgrendelt)}</td></tr>`).join("")}${beslisOnleesbaar.map(r => `
        <tr><td class="nr mono">?</td>
        <td class="besluit" colspan="3"><span class="pil onleesbaar">ONLEESBAAR</span>
        ${schoon(r.ruwe_regel)}</td></tr>`).join("")}
      </tbody></table>` : `<div class="leeg">Niets dat op jou wacht.</div>`)}
  </section>`);

  /* ---- 3. DE CENTRALE TAKENLIJST ---- */
  // Alles wat een taak is staat hier, in één lijst, in de volgorde waarin het aan de
  // beurt komt: nu · tot autocoding · daarna · net klaar. Wat vastzit staat er niet
  // apart onder maar ertússen, als een rij met de stand VAST — anders moet je twee
  // lijsten naast elkaar leggen om te zien wat er stilstaat.
  const rijen = [];
  const KLAAR_MARKERING = /^\s*(GEDAAN|KLAAR|OPGELOST|AFGEROND|OPGEHELDERD|GESLOTEN)\b[:\s-]*/i;

  // 3a. NU — het lopende en het openstaande werk van de supervisor
  for(const t of objecten(werk?.bezig).concat(objecten(werk?.open))){
    const st = klasse(t.status) === "bezig" ? "bezig" : "open";
    rijen.push({fase:"NU", stand:st === "bezig" ? "BEZIG" : "OPEN", klas:st,
      taak:kort(leesbaar(t.taak), 62), actie:kort(t.bewijs, 78),
      loopt:secTekst(t.loopt_seconden),
      verwacht:isGetal(t.verwacht_min) ? getal(t.verwacht_min) + " min" : "—",
      loopMin:isGetal(t.loopt_seconden) ? getal(t.loopt_seconden)/60 : null});
  }

  // 3b. NU — wat vastzit. Richard: "Werk dat vast zit: zet dat in de lijst met taken."
  // De ernst zit in de stand-kolom als tweede pil; de oplossing is de actiekolom,
  // want dat ís wat er moet gebeuren.
  for(const p of objecten(prob?.open)){
    rijen.push({fase:"NU", stand:"VAST", klas:"vast", ernst:schoon(p.ernst),
      opgepakt:schoon(p.opgepakt).replace(/_/g," "),
      taak:kort(leesbaar(p.id) || p.probleem, 62), actie:kort(p.oplossing, 78),
      loopt:"—", verwacht:"—"});
  }

  // 3c. TOT AUTOCODING — de zes stappen, mechanisch geteld uit de outbox
  // Richard, "INSTRUCTIE AAN HET BOARD-TEAM" 2026-09-09, punt 4: mislukt werk en
  // mislukt bewijs (BLOCKED_EVIDENCE — het werk leverde wél een uitkomst op, alleen
  // het bewijs kwam niet op het toegestane pad aan) zijn geen hetzelfde "VAST".
  // s.werk_mislukt/s.administratie_mislukt bestaan pas sinds die fix; op oudere
  // gecachte JSON (nog geen van beide velden) valt dit terug op het oude s.geblokkeerd.
  for(const s of objecten(route?.stappen)){
    const totaal = getal(s.taken_totaal), af = getal(s.met_receipt);
    const vast = isGetal(s.werk_mislukt) ? getal(s.werk_mislukt) : getal(s.geblokkeerd);
    const admin = isGetal(s.administratie_mislukt) ? getal(s.administratie_mislukt) : 0;
    const st = klasse(s.status);
    rijen.push({fase:"TOT AUTOCODING",
      stand:vast ? "VAST" : (schoon(s.status) || "OPEN"), klas:vast ? "vast" : (st || "open"),
      taak:kort(leesbaar(s.stap), 62),
      actie:`${esc(af)} van ${esc(totaal)} af` + (vast ? ` · <b>${esc(vast)} werk mislukt</b>` : "") +
            (admin ? ` · ${esc(admin)} administratie mislukt (bewijs niet aangekomen)` : "") +
            (totaal - af - vast - admin > 0 ? ` · ${esc(totaal - af - vast - admin)} te gaan` : ""),
      loopt:"laatst " + klok(s.laatste_activiteit), verwacht:"—"});
  }

  // 3d. DAARNA — de sporen ná autocoding
  const na = route?.na_autocoding;
  for(const s of objecten(na?.sporen)){
    rijen.push({fase:"DAARNA", stand:"OPEN", klas:"open",
      taak:kort(s.spoor, 62), actie:"", loopt:"—", verwacht:"—"});
  }

  // 3e. NET KLAAR — hoogstens MAX_KLAAR, want meer wil Richard hier niet zien.
  const klaarBron = objecten(werk?.klaar_recent)
    .map(t => ({taak:t.taak, actie:t.bewijs}))
    .concat(objecten(prob?.opgelost_recent).map(p => ({taak:p.id, actie:p.probleem})))
    .concat((Array.isArray(route?.nu_op_de_rol) ? route.nu_op_de_rol : [])
      .filter(r => KLAAR_MARKERING.test(String(prim(r))))
      .map(r => ({taak:String(prim(r)).replace(KLAAR_MARKERING, ""), actie:""})));
  const klaarTotaal = klaarBron.length;
  for(const k of klaarBron.slice(0, MAX_KLAAR)){
    rijen.push({fase:"NET KLAAR", stand:"KLAAR", klas:"klaar",
      taak:kort(leesbaar(k.taak), 62), actie:kort(k.actie, 78), loopt:"—", verwacht:"—"});
  }

  const nuRijen  = rijen.filter(r => r.fase === "NU");
  const nVast    = rijen.filter(r => r.stand === "VAST").length;
  const nOpen    = rijen.filter(r => r.stand === "OPEN" || r.stand === "BEZIG").length;
  const FASES = [
    ["NU",             "waar nu aan gewerkt wordt, en wat daarbij vastzit"],
    ["TOT AUTOCODING", "de stappen die af moeten voordat autocoding werkt"],
    ["DAARNA",         "het werk dat daarna aan de beurt is"],
    ["NET KLAAR",      `hoogstens ${MAX_KLAAR}${klaarTotaal > MAX_KLAAR ? ` van ${klaarTotaal}` : ""} — de rest staat op de stack-ticker`]
  ];

  blokken.push(`
  <section class="${nVast ? "urgent" : ""}">
    <div class="kopje"><span class="n">${rijen.length}</span><h2>Takenlijst</h2>
      <span class="bron">director-hartslag tik ${schoon(route?.tik ?? "?")} · ${secTekst(route?.leeftijd_seconden)} oud
        · supervisor tik ${schoon(prob?.tik ?? "?")} · ${secTekst(prob?.leeftijd_seconden)} oud</span></div>
    ${rijen.length ? `<table>
      <thead><tr><th>Taak</th><th>Stand</th><th>Waar het nu staat</th>
        <th class="mono">loopt al</th><th class="mono">verwacht</th></tr></thead>
      <tbody>${FASES.map(([fase, uitleg]) => {
        const inFase = rijen.filter(r => r.fase === fase);
        if(!inFase.length) return "";
        return `<tr class="fase"><td colspan="5"><b>${esc(fase)}</b><span class="tel">${esc(inFase.length)} — ${esc(uitleg)}</span></td></tr>`
          + inFase.map(r => `
          <tr class="rij-${esc(r.klas)}">
            <td class="taak">${r.taak}</td>
            <td class="strak"><span class="pil ${esc(r.klas)}">${esc(r.stand)}</span>${
              r.ernst ? ` <span class="pil ${klasse(r.ernst)}">${r.ernst}</span>` : ""}${
              r.opgepakt ? ` <span class="pil open">${r.opgepakt}</span>` : ""}</td>
            <td class="actie">${r.actie || "<span style='color:var(--inkt-stil)'>—</span>"}</td>
            <td class="mono strak duur${r.loopMin === null || r.loopMin === undefined ? "" :
              (r.loopMin > 90 ? " zeerlang" : r.loopMin > 45 ? " lang" : "")}">${esc(r.loopt)}</td>
            <td class="mono strak" style="color:var(--inkt-stil)">${esc(r.verwacht)}</td>
          </tr>`).join("");
      }).join("")}</tbody></table>
      ${na && na.verouderd ? `<div class="verouderd">De regels onder <b>DAARNA</b> komen uit
        <code>${schoon(na.bron_pad)}</code>, een handgeschreven document van
        <b>${isGetal(na.leeftijd_seconden) ? esc(Math.round(getal(na.leeftijd_seconden)/86400)) : "onbekend veel"} dagen</b> oud.
        Dat is geschiedenis, geen stand — bijwerken van dat bestand is de enige manier om die regels te vertrouwen.</div>` : ""}`
      : `<div class="leeg">Geen taken in de bron.</div>`}
  </section>`);

  /* ---- 4. KANALEN — bezet of niet, en waarmee ---- */
  // Richard, 2026-09-09: "Ik wil per kanaal zien of deze bezet is en waarmee.
  // Geslaagd, geblokkeerd weg." De percentagebalken uit `capaciteit` staan hier
  // daarom niet meer; wat overblijft is de vraag die hij stelt.
  const volgorde = {BEZIG:0, GEBLOKKEERD:1, STALE:2, WACHT:3, VRIJ:4};
  // volgorde[a.status] converteert de bronwaarde naar een sleutel, en dat is dezelfde
  // ToPrimitive-val als String(): een status-object met kapotte toString sloopte de
  // sortering en daarmee de hele render. Sleutel dus via prim, niet rauw.
  // Reviewbevinding, ronde 4 — de proef zag het niet omdat één account nooit sorteert.
  const rang = (a) => volgorde[String(prim(a?.status))] ?? 9;
  const gesorteerd = lanes.slice().sort((a,b) =>
    rang(a) - rang(b) || getal(b.sinds_minuten) - getal(a.sinds_minuten));
  const bezet = lanes.filter(l => String(prim(l.status)) === "BEZIG").length;
  // "bezet" is één vraag met één antwoord: draait er werk op dit kanaal, ja of nee.
  // Alles wat geen levend proces is — GEBLOKKEERD, STALE, WACHT, VRIJ — is niet bezet;
  // de reden staat ernaast, zodat "nee" nooit hetzelfde leest als "vrij".
  const woord = {BEZIG:"", GEBLOKKEERD:"zit vast", STALE:"stil, geen teken van leven",
                 WACHT:"order uitgezet, nog geen antwoord", VRIJ:"vrij"};
  blokken.push(`
  <section>
    <div class="kopje"><span class="n">${bezet}/${lanes.length}</span><h2>Kanalen — bezet of vrij</h2>
      <span class="bron">live gemeten uit draaiende processen + outbox</span></div>
    ${lanes.length ? `<table>
      <thead><tr><th>Kanaal</th><th>Bezet?</th><th>Waarmee</th><th class="mono">al</th></tr></thead>
      <tbody>${gesorteerd.map(l => {
        const st = String(prim(l.status));
        const isBezet = st === "BEZIG";
        const m = l.sinds_minuten;
        const dk = !isGetal(m) ? "" : (getal(m) > 90 ? " zeerlang" : getal(m) > 45 ? " lang" : "");
        const reden = Object.prototype.hasOwnProperty.call(woord, st) ? woord[st] : schoon(l.status).toLowerCase();
        return `<tr class="rij-${klasse(l.status)}">
          <td class="mono strak">${schoon(l.actor)}</td>
          <td class="strak"><span class="pil ${isBezet ? "ja" : "nee"}">${isBezet ? "JA" : "NEE"}</span>${
            reden ? ` <span class="pil ${klasse(l.status)}">${esc(reden)}</span>` : ""}</td>
          <td>${l.taak_id ? esc(leesbaar(l.taak_id)) : "<span style='color:var(--inkt-stil)'>niets</span>"}</td>
          <td class="mono strak duur${dk}">${duurTekst(m)}</td>
        </tr>`;
      }).join("")}</tbody>
    </table>` : `<div class="leeg">Geen kanalen gemeten.</div>`}
  </section>`);

  /* ---- tellers: dezelfde vier getallen die de lijst hierboven laat zien ---- */
  el("tellers").innerHTML = [
    beslisTotaal ? `<span class="teller geel">jij beslist <b>${beslisTotaal}</b></span>` : "",
    `<span class="teller blauw">taken open <b>${nOpen}</b></span>`,
    nVast ? `<span class="teller rood">zit vast <b>${nVast}</b></span>` : "",
    `<span class="teller">kanalen bezet <b>${bezet}</b>/${lanes.length}</span>`
  ].filter(Boolean).join("");

  el("main").innerHTML = blokken.join("");

  /* ---- voetnoot: wat dit bord bewust NIET toont ---- */
  el("voet").innerHTML = `
    Dit bord leest <code>regiekamer.json</code> (${(JSON.stringify(d).length/1024/1024).toFixed(1)} MB,
    gebouwd door <code>bin/regiekamer-generator</code> via <code>bin/regiekamer-runner</code>)
    en toont niets dat daar niet in staat. Ververst zichzelf elke ${VERVERS_MS/1000} s.<br>
    Namen en omschrijvingen zijn ingekort tot één leesbare regel; een <b>…</b> betekent dat er meer stond.<br>
    Bewust weggelaten — dit is een takenlijst, geen logboek:
    wat er per order gebeurde (${events.length} tickerregels en ${
      isGetal(d.gebeurtenissen?.receipts_totaal) ? getal(d.gebeurtenissen.receipts_totaal) : "?"} receipts)
    staat op de <a href="../stack-ticker/">stack-ticker</a> ·
    slaag- en blokkadepercentages per kanaal ·
    opgeloste taken ouder dan de laatste ${MAX_KLAAR}.`;
}

async function laad(){
  try{
    // no-cache (niet no-store, geen cache-buster): de browser stuurt If-None-Match, GitHub Pages
    // antwoordt 304 + 0 bytes zolang de bron niet herbouwd is. Scheelt ~1 MB per ververssing.
    const r = await fetch(BRON, {cache:"no-cache"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  }catch(e){
    // Alles wegvegen wat uit de vorige lading kwam. Bleven de tellers en de voetnoot
    // staan, dan las het bord als een verse meting terwijl er geen data is — precies
    // de verwarring die dit bord moet wegnemen.
    el("main").innerHTML = `<div class="fout"><b>Data niet geladen.</b><br>
      ${esc(e && e.message ? e.message : e)} — bron: <code>${esc(BRON)}</code>.<br>
      Het bord toont liever niets dan verouderde cijfers.</div>`;
    el("tellers").innerHTML = "";
    el("voet").innerHTML = "";
    el("lamp").className = "lamp rood";
    el("versheid").className = "versheid mono rood";
    el("versheid").textContent = "geen data";
  }
}
laad();
setInterval(laad, VERVERS_MS);
</script>
</body>
</html>
