<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Output</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f6f5f1;--ink:#1c1c1c;--muted:#6b675f;--line:#d9d6cf;--tab:#fff;--accent:#2f5d50}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171716;--ink:#ecebe6;--muted:#a19c93;--line:#3a3934;--tab:#222220;--accent:#7fb8a3}}
:root[data-theme=dark]{--bg:#171716;--ink:#ecebe6;--muted:#a19c93;--line:#3a3934;--tab:#222220;--accent:#7fb8a3}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 12px 0 0;letter-spacing:.02em}
header h1 small{font-weight:400;color:var(--muted);margin-left:6px}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--tab);color:var(--ink);text-decoration:none;font-size:13px}
nav a[aria-current="page"]{border-color:var(--accent);color:var(--accent);font-weight:600}
nav a:focus-visible,.other:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.other{padding:7px 12px;border:1px dashed var(--line);border-radius:999px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:600}
iframe{flex:1;border:0;width:100%;background:#fff}
</style></head><body>
<header><h1>Output<small>uitwerking van applicaties</small></h1><nav id="tabs"></nav>
<span class="meta"><a class="other" href="../">← Regiekamer</a><span id="meta"></span></span></header>
<iframe id="frame" title="Bordinhoud"></iframe>
<script>
const TABS=[
 ["pijplijnkaart","Pijplijnkaart","../pijplijn/pijplijnkaart.html"],
 ["kaartenbak","Kaartenbak","../pijplijn/kaartenbak.html"],
 ["conceptpreview","Conceptpreview","../pijplijn/conceptpreview.html"]];
const nav=document.getElementById("tabs"),frame=document.getElementById("frame"),meta=document.getElementById("meta");
for(const [id,label,href] of TABS){const a=document.createElement("a");a.href="#"+id;a.textContent=label;a.dataset.id=id;nav.appendChild(a);}
function show(){const id=(location.hash||"#pijplijnkaart").slice(1);const t=TABS.find(x=>x[0]===id)||TABS[0];
 for(const a of nav.children){if(a.dataset.id===t[0])a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");}
 frame.src=t[2]+"?"+Date.now();document.title=t[1]+" · Output";
 meta.textContent="content-pijplijn (trend-pipeline) · cijfers en voortgang staan op de Regiekamer";}
addEventListener("hashchange",show);show();
</script></body></html>
