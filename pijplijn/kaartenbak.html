<title>Kaartenbak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EDEFEA; --surface:#FFFFFF; --surface-2:#E4E7DF; --ghost:#DEE1D8;
    --ink:#171A18; --ink-soft:#3C4038; --muted:#6B7168; --border:#D6D9CF;
    --accent:#1F5F6B; --accent-ink:#0E3A42; --accent-soft:rgba(31,95,107,.12);
    --confirmed:#2E6B4A; --confirmed-soft:rgba(46,107,74,.12);
    --nuanced:#8C6B1F; --nuanced-soft:rgba(140,107,31,.14);
    --rejected:#8B4A3E; --rejected-soft:rgba(139,74,62,.12);
    --wait:#57626C; --wait-soft:rgba(87,98,108,.12);
    --shadow:rgba(23,26,24,.18); --focus:#1F5F6B;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141715; --surface:#1C201D; --surface-2:#242822; --ghost:#2A2E27;
      --ink:#ECEFE9; --ink-soft:#C7CBC2; --muted:#8B9188; --border:#343830;
      --accent:#5FB8C2; --accent-ink:#BFE9EC; --accent-soft:rgba(95,184,194,.16);
      --confirmed:#74C293; --confirmed-soft:rgba(116,194,147,.16);
      --nuanced:#DCB753; --nuanced-soft:rgba(220,183,83,.16);
      --rejected:#DD9484; --rejected-soft:rgba(221,148,132,.16);
      --wait:#9DA9B1; --wait-soft:rgba(157,169,177,.16);
      --shadow:rgba(0,0,0,.55); --focus:#5FB8C2;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141715; --surface:#1C201D; --surface-2:#242822; --ghost:#2A2E27;
    --ink:#ECEFE9; --ink-soft:#C7CBC2; --muted:#8B9188; --border:#343830;
    --accent:#5FB8C2; --accent-ink:#BFE9EC; --accent-soft:rgba(95,184,194,.16);
    --confirmed:#74C293; --confirmed-soft:rgba(116,194,147,.16);
    --nuanced:#DCB753; --nuanced-soft:rgba(220,183,83,.16);
    --rejected:#DD9484; --rejected-soft:rgba(221,148,132,.16);
    --wait:#9DA9B1; --wait-soft:rgba(157,169,177,.16);
    --shadow:rgba(0,0,0,.55); --focus:#5FB8C2;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    margin:0; padding:20px 16px 32px; min-height:100vh;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  a{ color:var(--accent-ink); }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  #app{ max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }

  /* ---------- top bar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .topbar-title{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.05rem; letter-spacing:.01em; }
  .topbar-title .accent-dot{ color:var(--accent); }
  .progress-chip{ font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--muted); }
  .counters{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    font-family:"IBM Plex Mono",monospace; font-size:.72rem; font-weight:500;
    padding:3px 8px; border-radius:999px; letter-spacing:.02em; white-space:nowrap;
  }
  .chip.star{ background:var(--accent-soft); color:var(--accent-ink); }
  .chip.wait{ background:var(--wait-soft); color:var(--wait); }
  .chip.remove{ background:var(--rejected-soft); color:var(--rejected); }
  .link-btn{
    background:none; border:none; padding:0; color:var(--muted); font-size:.78rem;
    text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  }
  .link-btn:hover{ color:var(--ink); }

  /* ---------- stage / stack ---------- */
  /* Geen vaste 3/4-verhouding meer. Die maakte de kaart 340x453 en liet een
     lange teaser (NCSC-kaart, stapel W39) dwars over de knoppen heen lopen.
     De kaart volgt nu de hoogte van het scherm, met grenzen: hoog genoeg om
     te lezen, laag genoeg dat kaart en knoppen samen in beeld blijven — één
     beslissing per scherm, zonder scrollen naar de knoppen. */
  .stage{
    position:relative; width:100%; max-width:380px; margin:6px auto 0;
    height:clamp(420px, 66vh, 620px);
  }
  .ghost{
    position:absolute; inset:0; border-radius:18px; background:var(--surface);
    border:1px solid var(--border); box-shadow:0 6px 16px var(--shadow);
  }
  .ghost.g2{ transform:translateY(14px) scale(.94); opacity:.55; background:var(--surface-2); }
  .ghost.g1{ transform:translateY(7px) scale(.97); opacity:.8; }

  .card-drag{
    position:absolute; inset:0; will-change:transform; touch-action:none; cursor:grab;
  }
  .card-drag:active{ cursor:grabbing; }
  .card-flip{
    position:relative; width:100%; height:100%; perspective:1400px;
  }
  .card-flip-inner{
    position:relative; width:100%; height:100%; transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.7,.3,1);
  }
  .card-drag.flipped .card-flip-inner{ transform:rotateY(180deg); }

  /* overflow:hidden is de harde garantie: wat niet op de kaart past, schildert
     niet naast de kaart. Zonder deze regel liep de tekst over de knoppenrij en
     over de achterkant heen. Scrollen gebeurt binnen de kaart, niet erbuiten. */
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:18px; border:1px solid var(--border); background:var(--surface);
    box-shadow:0 14px 30px var(--shadow); padding:22px 22px 18px; display:flex; flex-direction:column;
    overflow:hidden;
  }
  .face-back{ transform:rotateY(180deg); }
  /* min-height:0 is niet optioneel: zonder die regel weigert een flexkind te
     krimpen en loopt het alsnog buiten de kaart. */
  .front-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; padding-right:2px; }

  /* front face */
  .card-title{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.4rem; line-height:1.18; }
  .card-kern{ font-size:.98rem; line-height:1.5; color:var(--ink-soft); margin-top:12px; }
  /* Hét feit is het anker waarop je oordeelt: het blijft staan, ook als de
     teaser erboven moet scrollen. Daarom flex:none en geen margin-top:auto —
     de scrollende kop duwt het nu vanzelf naar onderen. */
  .card-feit{
    flex:none; margin-top:12px; padding-top:14px; border-top:1px solid var(--border);
  }
  .feit-label{
    font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--accent); display:block; margin-bottom:5px;
  }
  .feit-text{ font-weight:600; font-size:1rem; line-height:1.35; }
  .card-pub{ margin-top:10px; font-size:.76rem; color:var(--muted); }
  .flip-hint{
    position:absolute; top:14px; right:16px; font-family:"IBM Plex Mono",monospace;
    font-size:.66rem; color:var(--muted); display:flex; align-items:center; gap:3px;
  }
  .wait-stamp{
    position:absolute; top:14px; left:16px; transform:rotate(-6deg);
    border:1.5px solid var(--rejected); color:var(--rejected);
    font-family:"IBM Plex Mono",monospace; font-size:.62rem; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase; padding:3px 7px; border-radius:5px;
    background:var(--rejected-soft);
  }

  /* back face */
  .back-head{ display:flex; flex-direction:column; gap:4px; padding-bottom:10px; border-bottom:1px solid var(--border); }
  .back-title{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.05rem; line-height:1.25; }
  .back-audit{ font-size:.72rem; color:var(--muted); }
  .back-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; margin-top:10px; padding-right:2px; }
  .back-scroll h3{
    font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.07em;
    text-transform:uppercase; color:var(--muted); margin:14px 0 6px;
  }
  .back-scroll h3:first-child{ margin-top:0; }
  .claim-row{ padding:7px 9px; border-radius:8px; margin-bottom:6px; font-size:.85rem; line-height:1.4; }
  .claim-row.confirmed{ background:var(--confirmed-soft); }
  .claim-row.nuanced{ background:var(--nuanced-soft); }
  .claim-row.rejected{ background:var(--rejected-soft); }
  .claim-text{ font-weight:600; }
  .claim-row.confirmed .claim-text{ color:var(--confirmed); }
  .claim-row.nuanced .claim-text{ color:var(--nuanced); }
  .claim-row.rejected .claim-text{ color:var(--rejected); }
  .claim-rationale{ color:var(--ink-soft); margin-top:2px; }
  .claim-src{ font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--muted); margin-top:3px; display:block; }
  .src-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .src-list li{ font-size:.82rem; line-height:1.4; }
  .src-id{ font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--muted); }
  .afbakening-text{ font-size:.82rem; line-height:1.5; color:var(--ink-soft); }

  /* ---------- controls ---------- */
  .controls{ display:flex; gap:8px; margin-top:2px; }
  .ctrl-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 4px 8px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); cursor:pointer; transition:background .15s, border-color .15s;
  }
  .ctrl-btn:hover{ background:var(--surface-2); }
  .ctrl-btn .glyph{ font-size:1.15rem; line-height:1; }
  .ctrl-btn .label{ font-size:.7rem; font-weight:600; letter-spacing:.02em; }
  .ctrl-btn .key{ font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--muted); }
  .ctrl-btn.remove .glyph{ color:var(--rejected); }
  .ctrl-btn.wait .glyph{ color:var(--wait); }
  .ctrl-btn.flip .glyph{ color:var(--ink-soft); }
  .ctrl-btn.star .glyph{ color:var(--accent); }
  .ctrl-btn.star{ border-color:var(--accent); }
  .ctrl-btn.news .glyph{ color:var(--accent); }
  .chip.news{ background:var(--accent-soft); color:var(--accent-ink); }
  @media (max-width:400px){ .ctrl-btn .key{ display:none; } }

  .undo-row{ display:flex; justify-content:center; }
  .undo-btn{
    background:none; border:none; color:var(--muted); font-size:.78rem; cursor:pointer;
    display:flex; align-items:center; gap:5px; padding:4px 8px;
  }
  .undo-btn:hover{ color:var(--ink); }
  .undo-btn:disabled{ opacity:.4; cursor:default; }
  .undo-btn .key{ font-family:"IBM Plex Mono",monospace; color:var(--muted); }

  /* ---------- interstitial / summary ---------- */
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:22px 20px; box-shadow:0 8px 20px var(--shadow);
  }
  .panel h2{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.3rem; margin-bottom:8px; }
  .panel p{ font-size:.9rem; line-height:1.5; color:var(--ink-soft); margin:0 0 14px; }
  .panel-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{
    font-size:.85rem; font-weight:600; padding:9px 16px; border-radius:9px; cursor:pointer;
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
  }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.ghost{ background:none; }

  .summary-list{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .summary-item{
    border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--surface-2);
  }
  .summary-item summary{ cursor:pointer; font-weight:600; font-size:.9rem; list-style:none; display:flex; justify-content:space-between; gap:8px; }
  .summary-item summary::-webkit-details-marker{ display:none; }
  .summary-item summary::after{ content:"▾"; color:var(--muted); font-size:.75rem; }
  .summary-item[open] summary::after{ content:"▴"; }
  .summary-detail{ margin-top:8px; font-size:.82rem; color:var(--ink-soft); line-height:1.5; }
  .summary-detail .src-list{ margin-top:6px; }
  .empty-note{ font-size:.85rem; color:var(--muted); }
  .footnote{ font-size:.76rem; color:var(--muted); margin-top:16px; line-height:1.5; }

  .db-badge{ font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--muted); }
  .db-badge.on{ color:var(--confirmed); }
  .reason-panel{ background:var(--surface); border:1px solid var(--rejected); border-radius:14px; padding:16px 16px 14px; box-shadow:0 8px 20px var(--shadow); display:flex; flex-direction:column; gap:10px; }
  .reason-panel h2{ font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.1rem; }
  .reason-panel .sub{ font-size:.82rem; color:var(--muted); margin:-4px 0 2px; }
  .reason-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
  @media (max-width:400px){ .reason-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .reason-btn{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:8px 9px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); cursor:pointer; text-align:left; }
  .reason-btn .k{ font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--muted); }
  .reason-btn .t{ font-size:.82rem; font-weight:600; line-height:1.2; }
  .reason-btn.sel{ border-color:var(--rejected); background:var(--rejected-soft); }
  .reason-btn.sel .k{ color:var(--rejected); }
  .reason-panel textarea{ width:100%; min-height:56px; resize:vertical; border:1px solid var(--border); border-radius:9px; padding:8px 10px; font-family:inherit; font-size:.88rem; background:var(--surface); color:var(--ink); }
  .reason-actions{ display:flex; gap:8px; align-items:center; }
  .reason-actions .hint{ margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--muted); }

  /* ---------- front marks (verrassing, terug op) ---------- */
  .front-marks{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding-right:76px; margin-bottom:8px; }
  .front-marks.below-stamp{ margin-top:22px; }
  .mark{
    font-family:"IBM Plex Mono",monospace; font-size:.62rem; font-weight:500; letter-spacing:.04em;
    padding:2px 7px; border-radius:999px; white-space:nowrap;
  }
  .mark.surprise{ background:var(--nuanced-soft); color:var(--nuanced); }
  .mark.back-on{ background:var(--wait-soft); color:var(--wait); }
  .mark.dossier{ background:var(--accent-soft); color:var(--accent-ink); }

  /* ---------- dossier-delta card ---------- */
  .delta-label{
    font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--accent); display:block; margin-bottom:6px;
  }
  .delta-count{ margin-top:auto; padding-top:14px; border-top:1px solid var(--border); font-size:.86rem; color:var(--ink-soft); }
  .delta-count strong{ font-size:1.5rem; font-family:"Fraunces",Georgia,serif; color:var(--ink); display:block; line-height:1.1; }
  .delta-item{ padding:7px 9px; border-radius:8px; margin-bottom:6px; font-size:.85rem; line-height:1.4; background:var(--surface-2); }
  .delta-item .t{ font-weight:600; }
  .delta-item .s{ font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--muted); display:block; margin-top:3px; }

  /* ---------- back actions ---------- */
  .back-actions{ margin-top:12px; padding-top:10px; border-top:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .back-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px; cursor:pointer;
    color:var(--ink); font-size:.78rem; font-weight:600; padding:6px 10px; display:flex; align-items:center; gap:5px;
  }
  .back-btn:hover{ border-color:var(--accent); }
  .back-btn .key{ font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--muted); }
  .back-confirm{ font-size:.74rem; color:var(--confirmed); font-weight:600; }
  .meta-row{ display:flex; flex-direction:column; gap:3px; font-size:.8rem; color:var(--ink-soft); }
  .meta-row .k{ font-family:"IBM Plex Mono",monospace; font-size:.64rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }

  /* ---------- leerverslag + leerlogboek ---------- */
  .leer-week{ font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.06em; color:var(--accent); text-transform:uppercase; }
  .leer-lines{ margin:10px 0 14px; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; }
  .leer-lines li{
    font-size:.9rem; line-height:1.45; color:var(--ink-soft);
    padding-left:14px; position:relative;
  }
  .leer-lines li::before{ content:"·"; position:absolute; left:2px; color:var(--accent); font-weight:700; }
  .log-entry{ border:1px solid var(--border); border-radius:12px; padding:14px 16px; background:var(--surface-2); }
  .log-list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .log-verdict{ font-size:.78rem; font-weight:600; margin-top:4px; }
  .log-verdict.yes{ color:var(--confirmed); }
  .log-verdict.no{ color:var(--nuanced); }
  .log-diff{ display:flex; flex-direction:column; gap:4px; margin-top:8px; font-size:.8rem; }
  .log-diff .plus{ color:var(--confirmed); }
  .log-diff .minus{ color:var(--rejected); }
  .log-diff .k{ font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }

  /* ---------- routeren ---------- */
  .route-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .route-teller{ font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--muted); }
  .route-card{
    border:1px solid var(--border); border-radius:12px; background:var(--surface-2);
    padding:12px 14px; margin:10px 0 12px;
  }
  .route-title{ font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.1rem; line-height:1.2; }
  .route-feit{ font-size:.86rem; line-height:1.4; color:var(--ink-soft); margin-top:6px; }
  .route-marks{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .route-label{
    font-family:"IBM Plex Mono",monospace; font-size:.64rem; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); display:block; margin-bottom:6px;
  }
  .dest-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
  @media (max-width:400px){ .dest-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
  .dest-btn{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    padding:7px 8px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); cursor:pointer; text-align:left;
  }
  .dest-btn .k{ font-family:"IBM Plex Mono",monospace; font-size:.6rem; color:var(--muted); }
  .dest-btn .t{ font-size:.78rem; font-weight:600; line-height:1.15; }
  .dest-btn.sel{ border-color:var(--accent); background:var(--accent-soft); }
  .dest-btn.sel .k{ color:var(--accent); }
  .dest-btn.archief.sel{ border-color:var(--wait); background:var(--wait-soft); }
  .dest-btn.archief.sel .k{ color:var(--wait); }
  .social-row{ margin-top:8px; padding:8px 10px; border-radius:9px; background:var(--accent-soft); }
  .social-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
  @media (max-width:400px){ .social-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .social-btn{
    padding:6px 8px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); cursor:pointer; font-size:.76rem; font-weight:600;
    display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left;
  }
  .social-btn .k{ font-family:"IBM Plex Mono",monospace; font-size:.58rem; color:var(--muted); font-weight:400; }
  .social-btn.sel{ border-color:var(--accent); background:var(--accent-soft); }
  .route-instr{
    width:100%; min-height:48px; resize:vertical; margin-top:10px;
    border:1px solid var(--border); border-radius:9px; padding:8px 10px;
    font-family:inherit; font-size:.86rem; background:var(--surface); color:var(--ink);
  }
  .route-nav{ display:flex; gap:8px; align-items:center; margin-top:12px; }
  .route-nav .hint{ margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--muted); }
  @media (max-width:400px){ .route-nav .hint{ display:none; } }

  /* ---------- wachtrij ---------- */
  .queue-line{ font-size:.86rem; color:var(--ink-soft); margin:0 0 10px; }
  .queue-group{ border:1px solid var(--border); border-radius:10px; background:var(--surface-2); padding:10px 12px; }
  .queue-list{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .queue-group summary{ cursor:pointer; font-weight:600; font-size:.9rem; list-style:none; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .queue-group summary::-webkit-details-marker{ display:none; }

  var WACHTRIJ_KEY = 'kaartenbak:wachtrij:v1';

  var MAX_WACHTRIJ = 200;

  var BESTEMMINGEN = [
    { id:'keynote',    label:'keynote',    toets:'1' },
    { id:'long-read',  label:'long-read',  toets:'2' },
    { id:'short-read', label:'short-read', toets:'3' },
    { id:'social',     label:'social',     toets:'4' },
    { id:'video',      label:'video',      toets:'5' },
    { id:'ebook',      label:'ebook',      toets:'6' },
    { id:'archief',    label:'archief',    toets:'7' }
  ];
  var SOCIAL_VORMEN = [
    { id:'tekst',       label:'tekst',       toets:'t' },
    { id:'tekst+beeld', label:'tekst + beeld', toets:'b' },
    { id:'carrousel',   label:'carrousel',   toets:'c' },
    { id:'video',       label:'video',       toets:'v' }
  ];

  var REASON_LABELS = {
    al_bekend:'al bekend', niet_mijn_thema:'niet mijn thema', te_zwak_bewijs:'te zwak bewijs',
    te_oud:'te oud', verkeerde_vorm:'verkeerde vorm', anders:'anders'
  };

  var MAANDEN = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];

  function isoDate(d){
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function vandaag(){ return isoDate(new Date()); }
  function overDagen(n){
    var d = new Date();
    d.setDate(d.getDate() + n);
    return isoDate(d);
  }
  function nlDatum(iso){
    if(!iso || iso.length < 10) return '';
    var m = Number(iso.slice(5,7));
    return Number(iso.slice(8,10)) + ' ' + (MAANDEN[m-1] || '');
  }
  function slaapt(d){ return !!(d && d.status === 'WAIT' && d.terugOp && d.terugOp > vandaag()); }

  function loadDecisions(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveDecisions(d){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }catch(e){}
  }

  var decisions = loadDecisions(); // { id: { status: 'STAR'|'WAIT'|'REMOVE', waitCount: n } }

  function loadJson(key, leeg){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : leeg;
    }catch(e){ return leeg; }
  }
  function saveJson(key, waarde){
    try{ localStorage.setItem(key, JSON.stringify(waarde)); }catch(e){}
  }

  var routering = loadJson(ROUTE_KEY, {});   // { cardId: { bestemmingen:[], socialVorm, instructie, week } }
  var wachtrijen = loadJson(WACHTRIJ_KEY, {}); // { bestemming: { bestemming, items:[], afgekapt, bijgewerkt } }
  var pendingRoute = {};
  var pendingQueue = {};

  function saveRoutering(){ saveJson(ROUTE_KEY, routering); }
  function saveWachtrijen(){ saveJson(WACHTRIJ_KEY, wachtrijen); }
  function routeVan(id){
    if(!routering[id]) routering[id] = { bestemmingen: [], socialVorm: null, instructie: '', week: isoWeek() };
    if(!Array.isArray(routering[id].bestemmingen)) routering[id].bestemmingen = [];
    return routering[id];
  }
  function queueItems(dest){
    var q = wachtrijen[dest];
    return (q && Array.isArray(q.items)) ? q.items : [];
  }

  function buildInitialStack(){
    var waited = [];
    var fresh = [];
    ALL_IDS.forEach(function(id){
      var d = decisions[id];
      if(d && (d.status === 'STAR' || d.status === 'REMOVE')) return;
      if(slaapt(d)) return;
      if(d && d.status === 'WAIT'){ waited.push(id); }
      else { fresh.push(id); }
    });
    waited.sort(function(a,b){
      var wa = (decisions[a] && decisions[a].waitCount) || 0;
      var wb = (decisions[b] && decisions[b].waitCount) || 0;
      if(wb !== wa) return wb - wa;
      return a - b;
    });
    return waited.concat(fresh);
  }

  var state = {
    stack: buildInitialStack(),
    flipped: false,

    history: [],
    mode: 'stack', // 'stack' | 'reason' | 'leerverslag' | 'logboek' | 'routeren' | 'wachtrij' | 'interstitial' | 'summary'
    leerverslag: null, // { week, regels[], ... } when one is waiting for an answer

  function setDbBadge(on, text){
    el.dbBadge.textContent = text || (on ? 'keuzes worden opgeslagen' : 'alleen in deze browser');
    el.dbBadge.classList.toggle('on', !!on);
  }

  function isoWeek(d){
    d = d || new Date();
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    var y = t.getUTCFullYear();
    var w = Math.ceil((((t - Date.UTC(y, 0, 1)) / 86400000) + 1) / 7);
    return y + '-W' + (w < 10 ? '0' + w : w);
  }

  function persist(id, entry, action){
    if(!db) return;
    var ref = db.doc('decisions/' + DECK + '~' + id);
    var card = byId[id];
    var body = entry ? {
      deck: DECK, cardId: id, title: card ? card.title : '',
      status: entry.status, waitCount: entry.waitCount || 0,
      terugOp: entry.terugOp || null,
      reason: entry.reason || null, comment: entry.comment || null,
      nieuwsbrief: entry.nieuwsbrief ? (entry.week || isoWeek()) : null,
      ts: new Date().toISOString()
    } : null;
    var run = function(){ return body ? ref.set(body) : ref.delete(); };
    var newsRef = db.doc('nieuwsbrief/' + (entry && entry.week ? entry.week : isoWeek()) + '~' + id);
    pendingWrites[id] = (pendingWrites[id] || Promise.resolve()).then(run, run).then(function(){
      if(entry && entry.nieuwsbrief){
        return newsRef.set({ deck: DECK, cardId: id, title: card ? card.title : '', week: entry.week || isoWeek(), ts: new Date().toISOString() });
      }
      if(action === 'UNDO'){ return newsRef.delete(); }
    }).then(function(){
      return db.collection('log').add({
        deck: DECK, cardId: id, action: action,
        reason: entry ? (entry.reason || null) : null,
        comment: entry ? (entry.comment || null) : null,
        ts: new Date().toISOString()
      });
    }).catch(function(){ setDbBadge(false, 'opslaan mislukt — keuzes staan lokaal'); });
  }

  function initDb(){
    if(!window.claude || typeof window.claude.use !== 'function') return;
    window.claude.use('db').then(function(ns){
      if(!ns) return;
      db = ns;
      return db.doc('meta/active').get().then(function(m){
        if(m.exists && m.data().deck) DECK = m.data().deck;
        return db.collection('cards').where('deck', '==', DECK).get();
      }).then(function(qs){
        if(qs && !qs.empty){
          CARDS = qs.docs.map(function(d){ return d.data(); });
          rebuildIndex();
        }
        return db.collection('decisions').where('deck', '==', DECK).get();
      }).then(function(qs){
        var remote = {};
        qs.docs.forEach(function(d){
          var x = d.data();
          remote[x.cardId] = {
            status: x.status, waitCount: x.waitCount || 0, terugOp: x.terugOp || null,
            reason: x.reason || null, comment: x.comment || null,
            nieuwsbrief: !!x.nieuwsbrief, week: x.nieuwsbrief || null
          };
        });
        decisions = remote;
        saveDecisions(decisions);
        state.stack = buildInitialStack();
        state.history = [];
        state.lapSeen = {};
        state.flipped = false;
        state.mode = 'stack';
        setDbBadge(true);
        el.logboekBtn.hidden = false;
        render();
        return laadRoutering();
      }).then(function(){
        return laadWachtrijen();
      }).then(function(){
        return laadLeerverslag();
      });
    }).catch(function(){ setDbBadge(false); });
  }

  function laadRoutering(){
    if(!db) return;
    return db.collection('routering').get().then(function(qs){
      qs.docs.forEach(function(d){
        var x = d.data() || {};
        if(x.cardId == null) return;
        routering[x.cardId] = {
          bestemmingen: Array.isArray(x.bestemmingen) ? x.bestemmingen : [],
          socialVorm: x.socialVorm || null,
          instructie: x.instructie || '',
          week: x.week || isoWeek()
        };
      });
      saveRoutering();
    }).catch(function(){});
  }

  function laadWachtrijen(){
    if(!db) return;
    return db.collection('wachtrij').get().then(function(qs){
      qs.docs.forEach(function(d){
        var x = d.data() || {};
        var naam = x.bestemming || d.id;
        wachtrijen[naam] = {
          bestemming: naam,
          items: Array.isArray(x.items) ? x.items : [],
          afgekapt: !!x.afgekapt,
          bijgewerkt: x.bijgewerkt || null
        };
      });
      saveWachtrijen();
    }).catch(function(){});
  }

  function laadLeerverslag(){
    if(!db) return;
    var week = isoWeek();
    return db.doc('leerverslag/' + week).get().then(function(snap){
      if(!snap.exists) return;
      var data = snap.data() || {};
      if(data.bevestigd === true || data.bevestigd === false) return;
      state.leerverslag = Object.assign({}, data, { week: week });
      if(state.mode === 'stack') showLeerverslag();
    }).catch(function(){});
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function bewijs(card){ return (card && card.podiumbewijs) || []; }
  function bronnenVan(card){ return (card && card.bronnen) || []; }
  function isDelta(card){ return !!(card && card.soort === 'dossier-delta'); }

  function heteFeit(card){
    var lijst = bewijs(card);
    var pick = null;
    for(var i=0;i<lijst.length;i++){
      if(lijst[i].status === 'BEVESTIGD'){ pick = lijst[i]; break; }
    }
    if(!pick){
      for(var j=0;j<lijst.length;j++){
        if(lijst[j].status === 'GENUANCEERD'){ pick = lijst[j]; break; }
      }
    }
    if(!pick) pick = lijst[0];
    return pick || null;
  }

  function publisherNames(card, claim){
    var bronnen = bronnenVan(card);
    var names = [];
    var ids = (claim && claim.sources) || [];
    ids.forEach(function(sid){
      var bron = bronnen.filter(function(b){ return b.id === sid; })[0];
      if(bron && bron.naam && names.indexOf(bron.naam) === -1) names.push(bron.naam);
    });
    if(!names.length){
      bronnen.forEach(function(b){
        if(b.naam && names.indexOf(b.naam) === -1) names.push(b.naam);
      });
    }
    return names.slice(0,3).join(' / ');
  }

  function claimRowHtml(claim, kind){
    var cls = kind === 'confirmed' ? 'confirmed' : kind === 'nuanced' ? 'nuanced' : 'rejected';
    return '<div class="claim-row ' + cls + '">' +
      '<div class="claim-text">' + escapeHtml(claim.claim) + '.</div>' +
      (claim.rationale ? '<div class="claim-rationale">' + escapeHtml(claim.rationale) + '</div>' : '') +
      (claim.sources.length ? '<span class="claim-src mono">bron: ' + escapeHtml(claim.sources.join(', ')) + '</span>' : '') +
      '</div>';
  }

  function marksHtml(card, d, heeftStamp){
    var marks = [];
    if(card && card.verrassing) marks.push('<span class="mark surprise">verrassing</span>');
    if(d && d.terugOp) marks.push('<span class="mark back-on">terug op ' + escapeHtml(nlDatum(d.terugOp)) + '</span>');
    if(card && card.dossier && !isDelta(card)) marks.push('<span class="mark dossier">' + escapeHtml(card.dossier) + '</span>');
    if(!marks.length) return '';
    return '<div class="front-marks' + (heeftStamp ? ' below-stamp' : '') + '">' + marks.join('') + '</div>';
  }

  function deltaItems(card){
    var items = (card && (card.items || card.nieuw)) || [];
    return Array.isArray(items) ? items : [];
  }

  function renderFront(card, waitCount){
    var d = decisions[card.id];
    var heeftStamp = waitCount >= 3;
    var html = '';
    html += '<div class="flip-hint">omdraaien ↑</div>';
    if(heeftStamp){
      html += '<div class="wait-stamp">' + waitCount + '&times; overgeslagen</div>';
    }
    html += marksHtml(card, d, heeftStamp);

    if(isDelta(card)){
      var items = deltaItems(card);
      var aantal = typeof card.aantal === 'number' ? card.aantal : items.length;
      html += '<span class="delta-label">Dossier · ' + escapeHtml(card.week || isoWeek()) + '</span>';
      html += '<div class="front-scroll">';
      html += '<h1 class="card-title">' + escapeHtml(card.dossier || card.title || 'Dossier') + '</h1>';
      html += '<p class="card-kern">' + escapeHtml(card.kern || card.samenvatting || 'Wat kwam er deze week bij in dit dossier.') + '</p>';
      html += '</div>';
      html += '<div class="delta-count"><strong>' + aantal + '</strong>' +
        (aantal === 1 ? 'nieuw item deze week' : 'nieuwe items deze week') + '</div>';
      el.faceFront.innerHTML = html;
      return;
    }

    var feit = heteFeit(card);
    var pubs = publisherNames(card, feit);
    html += '<div class="front-scroll">';
    html += '<h1 class="card-title">' + escapeHtml(card.title) + '</h1>';
    html += '<p class="card-kern">' + escapeHtml(card.kern || '') + '</p>';
    html += '</div>';
    if(feit){
      html += '<div class="card-feit">' +
        '<span class="feit-label">Hét feit</span>' +
        '<p class="feit-text">' + escapeHtml(feit.claim) + '.</p>' +
        (pubs ? '<div class="card-pub">volgens ' + escapeHtml(pubs) + '</div>' : '') +
        '</div>';
    } else if(pubs){
      html += '<div class="card-feit"><div class="card-pub">volgens ' + escapeHtml(pubs) + '</div></div>';
    }
    el.faceFront.innerHTML = html;
  }

  function bronRegelHtml(b){
    var label = escapeHtml(b.naam || b.id || b.url || 'bron');
    var kop = b.url
      ? '<a href="' + escapeHtml(b.url) + '" target="_blank" rel="noopener">' + label + '</a>'
      : label;
    var staart = '';
    if(b.id && b.naam) staart += ' <span class="src-id">' + escapeHtml(b.id) + '</span>';
    if(b.meetdatum) staart += ' <span class="src-id">gemeten ' + escapeHtml(b.meetdatum) + '</span>';
    if(b.beschrijving) staart += ' — ' + escapeHtml(b.beschrijving);
    return '<li>' + kop + staart + '</li>';
  }

  function backActiesHtml(){
    return '<div class="back-actions">' +
      '<button class="back-btn" id="btnMeer" type="button">↗ Meer zoals dit <span class="key">M</span></button>' +
      '<span class="back-confirm" id="meerConfirm" hidden>gevraagd</span>' +
      '</div>';
  }

  function renderBack(card){
    var html = '';
    html += '<div class="back-head">' +
      '<div class="back-title">' + escapeHtml(isDelta(card) ? (card.dossier || card.title || 'Dossier') : card.title) + '</div>' +
      '<div class="back-audit mono">' + escapeHtml(card.claimaudit || (isDelta(card) ? (card.week || '') : '')) + '</div>' +
      '</div>';
    html += '<div class="back-scroll">';

    if(isDelta(card)){
      var items = deltaItems(card);
      html += '<h3>Nieuw deze week</h3>';
      if(items.length){
        items.forEach(function(it){
          var bron = it.bron || {};
          var naam = bron.naam || it.bronnaam || '';
          var url = bron.url || it.url || '';
          html += '<div class="delta-item">' +
            '<div class="t">' + escapeHtml(it.titel || it.title || '') + '</div>' +
            (it.kern ? '<div>' + escapeHtml(it.kern) + '</div>' : '') +
            (naam || url
              ? '<span class="s">' + (url
                  ? '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(naam || url) + '</a>'
                  : escapeHtml(naam)) +
                (it.meetdatum ? ' · gemeten ' + escapeHtml(it.meetdatum) : '') + '</span>'
              : '') +
            '</div>';
        });
      } else {
        html += '<p class="afbakening-text">Geen losse items meegegeven bij deze deltakaart.</p>';
      }
      html += backActiesHtml();
      html += '</div>';
      el.faceBack.innerHTML = html;
      return;
    }

    var lijst = bewijs(card);
    var confirmed = lijst.filter(function(c){ return c.status === 'BEVESTIGD'; });
    var nuanced = lijst.filter(function(c){ return c.status === 'GENUANCEERD'; });
    var rejected = card.nietGebruiken || [];

    if(confirmed.length){
      html += '<h3>Bevestigd</h3>';
      confirmed.forEach(function(c){ html += claimRowHtml(c, 'confirmed'); });
    }
    if(nuanced.length){
      html += '<h3>Genuanceerd</h3>';
      nuanced.forEach(function(c){ html += claimRowHtml(c, 'nuanced'); });
    }
    if(rejected.length){
      html += '<h3>Niet gebruiken</h3>';
      rejected.forEach(function(c){ html += claimRowHtml(c, 'rejected'); });
    }

    var bronnen = bronnenVan(card);
    if(bronnen.length){
      html += '<h3>Bronnen</h3><ul class="src-list">';
      bronnen.forEach(function(b){ html += bronRegelHtml(b); });
      html += '</ul>';
    }

    if(card.houdbaarheid || card.feit_of_prognose || card.dossier){
      html += '<h3>Houdbaarheid</h3><div class="meta-row">';
      if(card.houdbaarheid) html += '<div><span class="k">veroudert</span> ' + escapeHtml(card.houdbaarheid) + '</div>';
      if(card.feit_of_prognose) html += '<div><span class="k">aard</span> ' + escapeHtml(card.feit_of_prognose) + '</div>';
      if(card.dossier) html += '<div><span class="k">dossier</span> ' + escapeHtml(card.dossier) + '</div>';
      html += '</div>';
    }

    if(card.afbakening){
      html += '<h3>Begrenzing</h3><p class="afbakening-text">' + escapeHtml(card.afbakening) + '</p>';
    }
    html += backActiesHtml();
    html += '</div>';
    el.faceBack.innerHTML = html;
  }

  function currentId(){ return state.stack[0]; }

  function updateCounters(){
    var star=0, wait=0, remove=0, news=0;
    Object.keys(decisions).forEach(function(k){
      var s = decisions[k].status;
      if(s==='STAR') star++; else if(s==='WAIT') wait++; else if(s==='REMOVE') remove++;
      if(decisions[k].nieuwsbrief) news++;
    });
    el.chipStar.textContent = '★ ' + star;
    el.chipNews.textContent = '✉ ' + news;
    el.chipWait.textContent = '⏸ ' + wait;
    el.chipRemove.textContent = '✕ ' + remove;
    var done = star + remove;
    el.progressChip.textContent = done + ' besloten · ' + state.stack.length + ' in de stapel · ' + ALL_IDS.length + ' totaal';
  }

  function renderGhosts(){
    el.ghost1.style.visibility = state.stack.length > 1 ? 'visible' : 'hidden';
    el.ghost2.style.visibility = state.stack.length > 2 ? 'visible' : 'hidden';
  }

  var controlsEl = document.querySelector('.controls');
  var undoRowEl = document.querySelector('.undo-row');

  function render(){
    var inStack = state.mode === 'stack';
    var inReason = state.mode === 'reason';
    el.stage.hidden = !(inStack || inReason);
    controlsEl.hidden = !inStack;
    undoRowEl.hidden = !inStack;
    el.reasonPanel.hidden = !inReason;
    el.leerPanel.hidden = state.mode !== 'leerverslag';
    el.logPanel.hidden = state.mode !== 'logboek';
    el.routePanel.hidden = state.mode !== 'routeren';
    el.queuePanel.hidden = state.mode !== 'wachtrij';
    if(!inStack && !inReason){
      updateCounters();
      return;
    }
    el.interstitial.hidden = true;
    el.summary.hidden = true;
    if(inReason){
      updateCounters();
      return;
    }

    if(state.stack.length === 0){
      showSummary(false);
      return;
    }
    var id = currentId();
    var card = byId[id];
    var d = decisions[id];
    var waitCount = d ? (d.waitCount || 0) : 0;
    renderFront(card, waitCount);
    renderBack(card);
    el.cardDrag.classList.toggle('flipped', state.flipped);
    el.cardDrag.style.transform = '';
    renderGhosts();
    updateCounters();
    el.btnUndo.disabled = state.history.length === 0;
    el.btnNote.disabled = state.history.length === 0;
  }

  // ---------- decisions ----------
  function pushHistory(entry){
    state.history.push(entry);
    el.btnUndo.disabled = false;
  }

  function decide(action, extra){
    if(state.mode !== 'stack' || state.stack.length === 0) return;
    var id = state.stack[0];
    var prevDecision = decisions[id] ? Object.assign({}, decisions[id]) : null;
    var prevStack = state.stack.slice();
    var prevLapSeen = Object.assign({}, state.lapSeen);
    var prevFlipped = state.flipped;

    if(action === 'STAR'){
      decisions[id] = {
        status:'STAR', waitCount: prevDecision ? prevDecision.waitCount||0 : 0,
        nieuwsbrief: !!(extra && extra.nieuwsbrief),
        week: extra && extra.nieuwsbrief ? isoWeek() : null
      };
      state.stack.shift();
      state.flipped = false;
    } else if(action === 'REMOVE'){
      decisions[id] = {
        status:'REMOVE', waitCount: prevDecision ? prevDecision.waitCount||0 : 0,
        reason: extra && extra.reason ? extra.reason : null,
        comment: extra && extra.comment ? extra.comment : null
      };
      state.stack.shift();
      state.flipped = false;
    } else if(action === 'WAIT'){
      var wc = (prevDecision && prevDecision.waitCount ? prevDecision.waitCount : 0) + 1;
      decisions[id] = { status:'WAIT', waitCount: wc, terugOp: overDagen(WAIT_DAGEN) };
      state.lapSeen[id] = true;
      var lapComplete = state.stack.every(function(sid){ return state.lapSeen[sid]; });
      state.stack.shift();
      state.flipped = false;
      if(lapComplete && state.stack.length > 0){
        pushHistory({ id:id, action:action, prevDecision:prevDecision, prevStack:prevStack, prevLapSeen:prevLapSeen, prevFlipped:prevFlipped, wentToInterstitial:true });
        saveDecisions(decisions);
        persist(id, decisions[id], action);
        state.lapSeen = {};
        showInterstitial();
        return;
      }
    }
    pushHistory({ id:id, action:action, prevDecision:prevDecision, prevStack:prevStack, prevLapSeen:prevLapSeen, prevFlipped:prevFlipped, wentToInterstitial:false });
    saveDecisions(decisions);
    persist(id, decisions[id], action);
    render();
  }

  // ---------- optional note on the last decision ----------
  var reasonPick = null;
  var noteTarget = null;
  var noteContext = 'decision';

  function openNote(){
    if(state.mode !== 'stack' || !state.history.length) return;
    var last = state.history[state.history.length - 1];
    noteContext = 'decision';
    noteTarget = last.id;
    var d = decisions[noteTarget] || {};
    reasonPick = d.reason || null;
    el.reasonGrid.hidden = false;
    el.reasonSub.textContent = 'Alles optioneel. Een reden of een zin helpt de volgende zoekronde; zonder opmerking leer ik uit de kaart zelf.';
    el.reasonHint.textContent = '1–6 reden · Enter bewaart · Esc terug';
    el.reasonComment.placeholder = 'Commentaar (optioneel): wat had beter gemoeten?';
    el.reasonComment.value = d.comment || '';
    el.reasonTitle.textContent = (d.status || 'keuze') + ' — ' + (byId[noteTarget] ? byId[noteTarget].title : '');
    Array.prototype.forEach.call(el.reasonGrid.querySelectorAll('.reason-btn'), function(b){
      b.classList.toggle('sel', b.getAttribute('data-reason') === reasonPick);
    });
    state.mode = 'reason';
    render();
    el.reasonComment.focus();
  }

  function openLeerNote(){
    if(!state.leerverslag) return;
    noteContext = 'leerverslag';
    noteTarget = null;
    reasonPick = null;
    el.reasonGrid.hidden = true;
    el.reasonTitle.textContent = 'Wat klopt er niet?';
    el.reasonSub.textContent = 'Eén zin is genoeg — die stuurt de volgende zoekronde.';
    el.reasonHint.textContent = 'Enter bewaart · Esc terug';
    el.reasonComment.placeholder = 'Bijvoorbeeld: niet te oud, ik kende het al.';
    el.reasonComment.value = state.leerverslag.opmerking || '';
    state.mode = 'reason';
    render();
    el.reasonComment.focus();
  }
  function pickReason(code){
    reasonPick = reasonPick === code ? null : code;
    Array.prototype.forEach.call(el.reasonGrid.querySelectorAll('.reason-btn'), function(b){
      b.classList.toggle('sel', b.getAttribute('data-reason') === reasonPick);
    });
  }
  function saveNote(){
    if(state.mode !== 'reason') return;
    if(noteContext === 'leerverslag'){
      antwoordLeerverslag(false, el.reasonComment.value.trim() || null);
      return;
    }
    if(noteTarget == null) return;
    var d = decisions[noteTarget];
    if(d){
      d.reason = reasonPick || null;
      d.comment = el.reasonComment.value.trim() || null;
      saveDecisions(decisions);
      persist(noteTarget, d, 'NOTE');
    }
    state.mode = 'stack';
    render();
  }
  function cancelNote(){
    if(state.mode !== 'reason') return;
    if(noteContext === 'leerverslag' && state.leerverslag){
      showLeerverslag();
      return;
    }
    state.mode = 'stack';
    render();
  }

  function undo(){
    if(!state.history.length) return;
    var entry = state.history.pop();
    if(entry.prevDecision){ decisions[entry.id] = entry.prevDecision; }
    else { delete decisions[entry.id]; }
    persist(entry.id, entry.prevDecision || null, 'UNDO');
    state.stack = entry.prevStack;
    state.lapSeen = entry.prevLapSeen;
    state.flipped = entry.prevFlipped;
    saveDecisions(decisions);
    state.mode = 'stack';
    el.btnUndo.disabled = state.history.length === 0;
    render();
  }

  function flip(){
    if(state.mode !== 'stack' || state.stack.length === 0) return;
    state.flipped = !state.flipped;
    el.cardDrag.classList.toggle('flipped', state.flipped);
  }

  // ---------- V-24 leerverslag ----------
  function leerRegels(data){
    var regels = data.regels || data.lines || data.punten || [];
    if(typeof regels === 'string') regels = [regels];
    return (Array.isArray(regels) ? regels : []).slice(0, 5);
  }

  function showLeerverslag(){
    var data = state.leerverslag;
    if(!data){ state.mode = 'stack'; render(); return; }
    state.mode = 'leerverslag';
    el.interstitial.hidden = true;
    el.summary.hidden = true;
    var regels = leerRegels(data);
    var html = '';
    html += '<div class="leer-week">Leerverslag · ' + escapeHtml(data.week || isoWeek()) + '</div>';
    html += '<h2>Dit heb ik vorige week van je geleerd</h2>';
    if(regels.length){
      html += '<ul class="leer-lines">';
      regels.forEach(function(r){ html += '<li>' + escapeHtml(r) + '</li>'; });
      html += '</ul>';
    } else {
      html += '<p class="empty-note">Geen regels meegegeven bij dit verslag.</p>';
    }
    html += '<div class="panel-actions">' +
      '<button class="btn primary" id="leerJa" type="button">Klopt</button>' +
      '<button class="btn ghost" id="leerNee" type="button">Niet helemaal</button>' +
      '</div>';
    el.leerPanel.hidden = false;
    el.leerPanel.innerHTML = html;
    document.getElementById('leerJa').addEventListener('click', function(){ antwoordLeerverslag(true, null); });
    document.getElementById('leerNee').addEventListener('click', openLeerNote);
    render();
  }

  function antwoordLeerverslag(bevestigd, opmerking){
    var data = state.leerverslag;
    state.leerverslag = null;
    state.mode = 'stack';
    render();
    if(!db || !data) return;
    var body = Object.assign({}, data, {
      bevestigd: bevestigd,
      opmerking: opmerking || null,
      beantwoordOp: new Date().toISOString()
    });
    db.doc('leerverslag/' + data.week).set(body).catch(function(){});
  }

  // ---------- V-54 leerlogboek ----------
  function showLogboek(){
    if(!db) return;
    state.mode = 'logboek';
    el.interstitial.hidden = true;
    el.summary.hidden = true;
    el.logPanel.hidden = false;
    el.logPanel.innerHTML = '<h2>Leerlogboek</h2><p class="empty-note">Laden…</p>';
    render();
    db.collection('leerverslag').get().then(function(qs){
      var rijen = qs.docs.map(function(d){
        var x = d.data() || {};
        x.week = x.week || d.id;
        return x;
      }).sort(function(a,b){ return a.week < b.week ? 1 : a.week > b.week ? -1 : 0; });
      var html = '<h2>Leerlogboek</h2>' +
        '<p>Wat het systeem week na week van je swipes leerde, nieuwste bovenaan.</p>';
      if(!rijen.length){
        html += '<p class="empty-note">Nog geen leerverslagen. Het eerste komt na je eerste zaterdagstapel.</p>';
      } else {
        html += '<div class="log-list">';
        rijen.forEach(function(x){
          html += '<div class="log-entry">';
          html += '<div class="leer-week">' + escapeHtml(x.week) + '</div>';
          var regels = leerRegels(x);
          if(regels.length){
            html += '<ul class="leer-lines">';
            regels.forEach(function(r){ html += '<li>' + escapeHtml(r) + '</li>'; });
            html += '</ul>';
          }
          if(x.bevestigd === true){
            html += '<div class="log-verdict yes">✓ bevestigd</div>';
          } else if(x.bevestigd === false){
            html += '<div class="log-verdict no">✕ gecorrigeerd' +
              (x.opmerking ? ': ' + escapeHtml(x.opmerking) : '') + '</div>';
          } else {
            html += '<div class="log-verdict">nog niet beoordeeld</div>';
          }
          var diff = x.profielDiff || {};
          var toegevoegd = diff.toegevoegd || [];
          var verwijderd = diff.verwijderd || [];
          if(toegevoegd.length || verwijderd.length){
            html += '<div class="log-diff"><span class="k">profiel</span>';
            toegevoegd.forEach(function(r){ html += '<div class="plus">+ ' + escapeHtml(r) + '</div>'; });
            verwijderd.forEach(function(r){ html += '<div class="minus">− ' + escapeHtml(r) + '</div>'; });
            html += '</div>';
          }
          var br = x.bronnen || {};
          var op = br.op || [];
          var slaap = br.slaap || [];
          if(op.length || slaap.length){
            html += '<div class="log-diff"><span class="k">bronnen</span>';
            if(op.length) html += '<div class="plus">↑ ' + escapeHtml(op.join(', ')) + '</div>';
            if(slaap.length) html += '<div class="minus">↓ ' + escapeHtml(slaap.join(', ')) + '</div>';
            html += '</div>';
          }
          html += '</div>';
        });
        html += '</div>';
      }
      html += '<div class="panel-actions" style="margin-top:14px;">' +
        '<button class="btn primary" id="logTerug" type="button">Terug naar de stapel</button></div>';
      el.logPanel.innerHTML = html;
      document.getElementById('logTerug').addEventListener('click', sluitLogboek);
    }).catch(function(){
      el.logPanel.innerHTML = '<h2>Leerlogboek</h2><p class="empty-note">Kon het logboek niet laden.</p>' +
        '<div class="panel-actions"><button class="btn primary" id="logTerug" type="button">Terug naar de stapel</button></div>';
      document.getElementById('logTerug').addEventListener('click', sluitLogboek);
    });
  }

  function sluitLogboek(){
    state.mode = state.leerverslag ? 'leerverslag' : 'stack';
    if(state.mode === 'leerverslag'){ showLeerverslag(); return; }
    render();
  }

  // ---------- V-28 meer zoals dit ----------
  function meerZoalsDit(){
    if(state.mode !== 'stack' || state.stack.length === 0) return;
    var id = state.stack[0];
    var card = byId[id];
    var titel = card ? (card.title || card.dossier || '') : '';
    var week = isoWeek();
    var body = { cardId: id, titel: titel, type: 'meer-zoals-dit', deck: DECK, week: week, ts: new Date().toISOString() };
    try{
      var raw = localStorage.getItem(VERZOEK_KEY);
      var lijst = raw ? JSON.parse(raw) : [];
      lijst.push(body);
      localStorage.setItem(VERZOEK_KEY, JSON.stringify(lijst));
    }catch(e){}
    if(db){
      db.doc('verzoeken/' + week + '~' + id).set(body).catch(function(){});
    }
    var mark = document.getElementById('meerConfirm');
    if(mark){
      mark.hidden = false;
      setTimeout(function(){
        var m = document.getElementById('meerConfirm');
        if(m) m.hidden = true;
      }, 2000);
    }
  }

  // ---------- wachtrij: opslag ----------
  function queueAdd(dest, entry){
    var lokaal = wachtrijen[dest] || { bestemming: dest, items: [] };
    if(!Array.isArray(lokaal.items)) lokaal.items = [];
    lokaal.items = lokaal.items.filter(function(i){ return !(i.cardId === entry.cardId && i.week === entry.week); });
    lokaal.items.push(entry);
    if(lokaal.items.length > MAX_WACHTRIJ){
      lokaal.items = lokaal.items.slice(lokaal.items.length - MAX_WACHTRIJ);
      lokaal.afgekapt = true;
    }
    lokaal.bijgewerkt = new Date().toISOString();
    wachtrijen[dest] = lokaal;
    saveWachtrijen();
    if(!db) return;
    pendingQueue[dest] = (pendingQueue[dest] || Promise.resolve()).then(function(){
      var ref = db.doc('wachtrij/' + dest);
      return ref.get().then(function(snap){
        var body = (snap.exists && snap.data()) || {};
        var items = Array.isArray(body.items) ? body.items.slice() : [];
        items = items.filter(function(i){ return !(i.cardId === entry.cardId && i.week === entry.week); });
        items.push(entry);
        var afgekapt = !!body.afgekapt;
        if(items.length > MAX_WACHTRIJ){ items = items.slice(items.length - MAX_WACHTRIJ); afgekapt = true; }
        return ref.set({ bestemming: dest, items: items, afgekapt: afgekapt, bijgewerkt: new Date().toISOString() });
      });
    }).catch(function(){ setDbBadge(false, 'wachtrij staat lokaal'); });
  }

  function queueRemove(dest, cardId, week){
    var lokaal = wachtrijen[dest];
    if(lokaal && Array.isArray(lokaal.items)){
      lokaal.items = lokaal.items.filter(function(i){ return !(i.cardId === cardId && (!week || i.week === week)); });
      lokaal.bijgewerkt = new Date().toISOString();
      saveWachtrijen();
    }
    if(!db) return;
    pendingQueue[dest] = (pendingQueue[dest] || Promise.resolve()).then(function(){
      var ref = db.doc('wachtrij/' + dest);
      return ref.get().then(function(snap){
        if(!snap.exists) return;
        var body = snap.data() || {};
        var items = Array.isArray(body.items) ? body.items : [];
        var over = items.filter(function(i){ return !(i.cardId === cardId && (!week || i.week === week)); });
        if(over.length === items.length) return;
        return ref.set({ bestemming: dest, items: over, afgekapt: !!body.afgekapt, bijgewerkt: new Date().toISOString() });
      });
    }).catch(function(){ setDbBadge(false, 'wachtrij staat lokaal'); });
  }

  function bewaarRoute(id, ookWachtrij){
    var r = routering[id];
    if(!r) return;
    var card = byId[id];
    var titel = card ? (card.title || card.dossier || '') : '';
    var week = r.week || isoWeek();
    var social = r.bestemmingen.indexOf('social') !== -1 ? (r.socialVorm || null) : null;
    var instructie = (r.instructie || '').trim() || null;
    saveRoutering();
    if(ookWachtrij){
      r.bestemmingen.forEach(function(dest){
        queueAdd(dest, {
          cardId: id, titel: titel, week: week,
          socialVorm: dest === 'social' ? social : null,
          instructie: instructie, toegevoegdOp: new Date().toISOString()
        });
      });
    }
    if(!db) return;
    var body = {
      cardId: id, titel: titel, deck: DECK, week: week,
      bestemmingen: r.bestemmingen.slice(),
      socialVorm: social, instructie: instructie,
      ts: new Date().toISOString()
    };
    pendingRoute[id] = (pendingRoute[id] || Promise.resolve()).then(function(){
      return db.doc('routering/' + week + '~' + id).set(body);
    }).catch(function(){ setDbBadge(false, 'routering staat lokaal'); });
  }

  // ---------- routeerscherm ----------
  function gesterd(){
    return ALL_IDS.filter(function(id){ return decisions[id] && decisions[id].status === 'STAR'; });
  }

  function showRouteren(){
    var lijst = gesterd();
    if(!lijst.length){ showSummary(true); return; }
    state.routeLijst = lijst;
    if(state.routeIdx >= lijst.length) state.routeIdx = 0;
    state.mode = 'routeren';
    el.interstitial.hidden = true;
    el.summary.hidden = true;
    el.queuePanel.hidden = true;
    renderRoute();
  }

  function renderRoute(){
    var id = state.routeLijst[state.routeIdx];
    var card = byId[id];
    if(!card){ routeNext(); return; }
    var r = routeVan(id);
    var feit = heteFeit(card);
    var regel = feit ? escapeHtml(feit.claim) + '.' : escapeHtml(card.kern || card.samenvatting || '');

    var html = '';
    html += '<div class="route-head"><h2>Bestemming kiezen</h2>' +
      '<span class="route-teller">' + (state.routeIdx + 1) + ' / ' + state.routeLijst.length + '</span></div>';
    html += '<div class="route-card">' +
      '<div class="route-title">' + escapeHtml(isDelta(card) ? (card.dossier || card.title || 'Dossier') : card.title) + '</div>' +
      (regel ? '<div class="route-feit">' + regel + '</div>' : '');
    var marks = [];
    if(card.dossier) marks.push('<span class="mark dossier">' + escapeHtml(card.dossier) + '</span>');
    if(decisions[id] && decisions[id].nieuwsbrief) marks.push('<span class="mark surprise">nieuwsbrief</span>');
    if(marks.length) html += '<div class="route-marks">' + marks.join('') + '</div>';
    html += '</div>';

    html += '<span class="route-label">Bestemmingen · meerdere mogen</span>';
    html += '<div class="dest-grid">';
    BESTEMMINGEN.forEach(function(b){
      var aan = r.bestemmingen.indexOf(b.id) !== -1;
      html += '<button class="dest-btn ' + b.id + (aan ? ' sel' : '') + '" type="button" data-dest="' + b.id + '">' +
        '<span class="k">' + b.toets + '</span><span class="t">' + escapeHtml(b.label) + '</span></button>';
    });
    html += '</div>';

    if(r.bestemmingen.indexOf('social') !== -1){
      html += '<div class="social-row"><span class="route-label">Welke vorm?</span><div class="social-grid">';
      SOCIAL_VORMEN.forEach(function(v){
        html += '<button class="social-btn' + (r.socialVorm === v.id ? ' sel' : '') + '" type="button" data-social="' + v.id + '">' +
          '<span>' + escapeHtml(v.label) + '</span><span class="k">' + v.toets + '</span></button>';
      });
      html += '</div></div>';
    }

    html += '<textarea class="route-instr" id="routeInstructie" placeholder="Opmerking of instructie voor de volgende stap (optioneel)">' +
      escapeHtml(r.instructie || '') + '</textarea>';

    html += '<div class="route-nav">' +
      '<button class="btn ghost" id="routeVorige" type="button"' + (state.routeIdx === 0 ? ' disabled' : '') + '>← vorige</button>' +
      '<button class="btn primary" id="routeVolgende" type="button">' +
      (state.routeIdx === state.routeLijst.length - 1 ? 'Klaar' : 'Volgende →') + '</button>' +
      '<button class="btn ghost" id="routeSluit" type="button">Overzicht</button>' +
      '<span class="hint">1–7 bestemming · Enter volgende · Esc terug</span>' +
      '</div>';

    el.routePanel.hidden = false;
    el.routePanel.innerHTML = html;

    el.routePanel.querySelectorAll('.dest-btn').forEach(function(b){
      b.addEventListener('click', function(){ toggleDest(b.getAttribute('data-dest')); });
    });
    el.routePanel.querySelectorAll('.social-btn').forEach(function(b){
      b.addEventListener('click', function(){ pickSocial(b.getAttribute('data-social')); });
    });
    var instr = document.getElementById('routeInstructie');
    instr.addEventListener('blur', function(){
      routeVan(id).instructie = instr.value;
      bewaarRoute(id, true);
    });
    document.getElementById('routeVorige').addEventListener('click', routePrev);
    document.getElementById('routeVolgende').addEventListener('click', routeNext);
    document.getElementById('routeSluit').addEventListener('click', sluitRoute);
    render();
  }

  function huidigeRouteId(){ return state.routeLijst[state.routeIdx]; }

  function leesInstructie(){
    var instr = document.getElementById('routeInstructie');
    var id = huidigeRouteId();
    if(instr && id != null) routeVan(id).instructie = instr.value;
  }

  function toggleDest(dest){
    var id = huidigeRouteId();
    if(id == null) return;
    leesInstructie();
    var r = routeVan(id);
    var card = byId[id];
    var week = r.week || isoWeek();
    var i = r.bestemmingen.indexOf(dest);
    if(i === -1){
      r.bestemmingen.push(dest);
      if(dest === 'social' && !r.socialVorm) r.socialVorm = 'tekst';
      queueAdd(dest, {
        cardId: id, titel: card ? (card.title || card.dossier || '') : '', week: week,
        socialVorm: dest === 'social' ? (r.socialVorm || 'tekst') : null,
        instructie: (r.instructie || '').trim() || null,
        toegevoegdOp: new Date().toISOString()
      });
    } else {
      r.bestemmingen.splice(i, 1);
      if(dest === 'social') r.socialVorm = null;
      queueRemove(dest, id, week);
    }
    bewaarRoute(id, false);
    renderRoute();
  }

  function pickSocial(vorm){
    var id = huidigeRouteId();
    if(id == null) return;
    leesInstructie();
    var r = routeVan(id);
    if(r.bestemmingen.indexOf('social') === -1) return;
    r.socialVorm = r.socialVorm === vorm ? null : vorm;
    bewaarRoute(id, true);
    renderRoute();
  }

  function bewaarHuidigeRoute(){
    var id = huidigeRouteId();
    if(id == null) return;
    leesInstructie();
    var r = routering[id];
    if(r && r.bestemmingen.length) bewaarRoute(id, true);
  }

  function routeNext(){
    bewaarHuidigeRoute();
    if(state.routeIdx >= state.routeLijst.length - 1){ sluitRoute(); return; }
    state.routeIdx += 1;
    renderRoute();
  }

  function routePrev(){
    bewaarHuidigeRoute();
    if(state.routeIdx === 0) return;
    state.routeIdx -= 1;
    renderRoute();
  }

  function sluitRoute(){
    bewaarHuidigeRoute();
    state.routeIdx = 0;
    showSummary(true);
  }

  // ---------- wachtrijscherm ----------
  function showWachtrij(vanuit){
    state.vorigeModus = vanuit || state.mode;
    state.mode = 'wachtrij';
    el.interstitial.hidden = true;
    el.summary.hidden = true;
    el.routePanel.hidden = true;
    renderWachtrij();
  }

  function renderWachtrij(){
    var totaal = 0;
    BESTEMMINGEN.forEach(function(b){ totaal += queueItems(b.id).length; });

    var html = '<h2>Wachtrij</h2>';
    html += '<p class="queue-line">' + (totaal
      ? 'Wat klaarstaat om in één batch geproduceerd te worden.'
      : 'Nog niets in de wachtrij. Kies eerst bestemmingen bij je gesterde kaarten.') + '</p>';

    if(totaal){
      html += '<div class="queue-list">';
      BESTEMMINGEN.forEach(function(b){
        var items = queueItems(b.id);
        if(!items.length) return;
        html += '<details class="queue-group"><summary>' + escapeHtml(b.label) +
          '<span class="queue-count">' + items.length + '</span></summary>';
        items.slice().reverse().forEach(function(it){
          html += '<div class="queue-item">' +
            '<div class="body">' + escapeHtml(it.titel || ('kaart ' + it.cardId)) +
            '<span class="meta">' + escapeHtml(it.week || '') +
            (it.socialVorm ? ' · ' + escapeHtml(it.socialVorm) : '') + '</span>' +
            (it.instructie ? '<span class="instr">' + escapeHtml(it.instructie) + '</span>' : '') +
            '</div>' +
            '<button class="queue-x" type="button" data-dest="' + b.id + '" data-card="' + it.cardId +
            '" data-week="' + escapeHtml(it.week || '') + '" title="uit de wachtrij halen">✕</button>' +
            '</div>';
        });
        if(wachtrijen[b.id] && wachtrijen[b.id].afgekapt){
          html += '<div class="queue-cap">Ouder dan de laatste ' + MAX_WACHTRIJ + ' items is afgekapt.</div>';
        }
        html += '</details>';
      });
      html += '</div>';
    }

    html += '<div class="panel-actions" style="margin-top:14px;">' +
      '<button class="btn primary" id="queueTerug" type="button">Terug</button>';
    if(gesterd().length){
      html += '<button class="btn ghost" id="queueRoute" type="button">Bestemming kiezen</button>';
    }
    html += '</div>';
    if(!db){
      html += '<p class="footnote">Deze wachtrij staat alleen in deze browser.</p>';
    }

    el.queuePanel.hidden = false;
    el.queuePanel.innerHTML = html;

    el.queuePanel.querySelectorAll('.queue-x').forEach(function(x){
      x.addEventListener('click', function(){
        var dest = x.getAttribute('data-dest');
        var cardId = x.getAttribute('data-card');
        var week = x.getAttribute('data-week') || null;
        var nid = Number(cardId);
        var id = isNaN(nid) ? cardId : nid;
        queueRemove(dest, id, week);
        var r = routering[id];
        if(r && Array.isArray(r.bestemmingen)){
          var i = r.bestemmingen.indexOf(dest);
          if(i !== -1){
            r.bestemmingen.splice(i, 1);
            if(dest === 'social') r.socialVorm = null;
            bewaarRoute(id, false);
          }
        }
        renderWachtrij();
      });
    });
    document.getElementById('queueTerug').addEventListener('click', sluitWachtrij);
    var qr = document.getElementById('queueRoute');
    if(qr) qr.addEventListener('click', showRouteren);
    render();
  }

  function sluitWachtrij(){
    if(state.vorigeModus === 'summary'){ showSummary(true); return; }
    if(state.vorigeModus === 'routeren' && state.routeLijst.length){ showRouteren(); return; }
    state.mode = 'stack';
    render();
  }

  function bestemmingsRegel(){
    var delen = [];
    BESTEMMINGEN.forEach(function(b){
      var n = queueItems(b.id).length;
      if(n) delen.push(n + ' ' + b.label);
    });
    return delen.join(' · ');
  }

  // ---------- interstitial ----------
  function showInterstitial(){
    state.mode = 'interstitial';
    var remaining = state.stack.length;
    el.summary.hidden = true;
    el.interstitial.hidden = false;
    el.interstitial.innerHTML =
      '<h2>Rondje klaar</h2>' +
      '<p>Je hebt elke kaart in de huidige stapel gezien. Er staan nog <strong>' + remaining + '</strong> kaart' + (remaining===1?'':'en') + ' op WAIT of onbeslist. Nog een rondje, of hier stoppen voor nu?</p>' +
      '<div class="panel-actions">' +
        '<button class="btn primary" id="continueBtn" type="button">Nog een rondje</button>' +
        '<button class="btn ghost" id="stopBtn" type="button">Stop voor nu</button>' +
      '</div>';
    document.getElementById('continueBtn').addEventListener('click', function(){
      state.mode = 'stack';
      render();
    });
    document.getElementById('stopBtn').addEventListener('click', function(){
      showSummary(true);
    });
    render();
  }

  // ---------- summary ----------
  function showSummary(paused){
    state.mode = 'summary';
    el.interstitial.hidden = true;
    el.routePanel.hidden = true;
    el.queuePanel.hidden = true;
    var starred = ALL_IDS.filter(function(id){ return decisions[id] && decisions[id].status === 'STAR'; });
    var removed = ALL_IDS.filter(function(id){ return decisions[id] && decisions[id].status === 'REMOVE'; });
    var waiting = state.stack.slice();
    var sleeping = ALL_IDS.filter(function(id){ return slaapt(decisions[id]); });
    var flagged = ALL_IDS.filter(function(id){
      return decisions[id] && decisions[id].status === 'WAIT' && decisions[id].waitCount >= 3;
    });

    var html = '';
    html += '<h2>' + (paused ? 'Gepauzeerd' : 'Stapel klaar') + '</h2>';
    if(!paused && waiting.length === 0 && sleeping.length === 0){
      html += '<p>Alle ' + ALL_IDS.length + ' kaarten zijn beslist: ' + starred.length + ' STAR, ' + removed.length + ' REMOVE.</p>';
    } else {
      html += '<p>' + starred.length + ' STAR · ' + removed.length + ' REMOVE · ' + waiting.length + ' nog in de stapel</p>';
    }
    if(sleeping.length){
      var eerste = sleeping.slice().sort(function(a,b){
        return decisions[a].terugOp < decisions[b].terugOp ? -1 : 1;
      })[0];
      html += '<p><strong>' + sleeping.length + ' kaart' + (sleeping.length===1?'':'en') + '</strong> ' +
        (sleeping.length===1?'slaapt':'slapen') + ' op WAIT; de eerste komt terug op ' +
        escapeHtml(nlDatum(decisions[eerste].terugOp)) + '.</p>';
    }
    if(flagged.length){
      html += '<p><strong>' + flagged.length + ' kaart' + (flagged.length===1?'':'en') + '</strong> is al 3× of vaker overgeslagen — dat is meestal een verkapte REMOVE.</p>';
    }

    var newsIds = starred.filter(function(id){ return decisions[id].nieuwsbrief; });
    if(newsIds.length){
      html += '<p><strong>Nieuwsbrief ' + escapeHtml(decisions[newsIds[0]].week || isoWeek()) + ':</strong> ' + newsIds.map(function(id){ return escapeHtml(byId[id].title); }).join(' · ') + '</p>';
    }
    if(starred.length){
      html += '<div class="summary-list">';
      starred.forEach(function(id){
        var card = byId[id];
        if(!card) return;
        var feit = heteFeit(card);
        var kop = isDelta(card) ? (card.dossier || card.title || 'Dossier') : card.title;
        var regel = feit ? escapeHtml(feit.claim) + '.' : escapeHtml(card.kern || card.samenvatting || '');
        html += '<details class="summary-item"><summary>' + (decisions[id].nieuwsbrief ? '✉ ' : '') + escapeHtml(kop) + '</summary>' +
          '<div class="summary-detail">' + regel +
          '<ul class="src-list">';
        bronnenVan(card).forEach(function(b){ html += bronRegelHtml(b); });
        html += '</ul></div></details>';
      });
      html += '</div>';
    } else {
      html += '<p class="empty-note">Nog niets gesterd.</p>';
    }

    var wachtrijRegel = bestemmingsRegel();
    if(wachtrijRegel){
      html += '<p><strong>In de wachtrij:</strong> ' + escapeHtml(wachtrijRegel) + '</p>';
    }

    var klaarMetStarred = !paused && waiting.length === 0 && starred.length > 0;
    if(klaarMetStarred){
      html += '<p>Je stapel is af. Geef je ' + starred.length + ' gesterde kaart' +
        (starred.length === 1 ? '' : 'en') + ' nu een bestemming, dan komen ze in de wachtrij voor productie.</p>';
    }

    html += '<div class="panel-actions" style="margin-top:14px;">';
    if(starred.length){
      html += '<button class="btn ' + (klaarMetStarred ? 'primary' : 'ghost') + '" id="routeBtn" type="button">Bestemming kiezen</button>';
    }
    if(waiting.length){
      html += '<button class="btn ' + (klaarMetStarred ? 'ghost' : 'primary') + '" id="resumeBtn" type="button">Verder triëren</button>';
    }
    if(wachtrijRegel){
      html += '<button class="btn ghost" id="summaryQueueBtn" type="button">Wachtrij</button>';
    }
    if(db){
      html += '<button class="btn ghost" id="summaryLogBtn" type="button">Leerlogboek</button>';
    }
    html += '<button class="btn ghost" id="resetBtn" type="button">Alles wissen</button>';
    html += '</div>';
    html += '<div id="resetConfirm" hidden></div>';

    html += '<p class="footnote">Een bestemming zet de kaart in een wachtrij; die wachtrijen zijn bedoeld om later in één batch te produceren — meerdere keynotes, social posts of long-reads tegelijk.</p>';

    el.summary.hidden = false;
    el.summary.innerHTML = html;

    if(waiting.length){
      document.getElementById('resumeBtn').addEventListener('click', function(){
        state.mode = 'stack';
        state.lapSeen = {};
        render();
      });
    }
    var sumRoute = document.getElementById('routeBtn');
    if(sumRoute) sumRoute.addEventListener('click', showRouteren);
    var sumQueue = document.getElementById('summaryQueueBtn');
    if(sumQueue) sumQueue.addEventListener('click', function(){ showWachtrij('summary'); });
    var sumLog = document.getElementById('summaryLogBtn');
    if(sumLog) sumLog.addEventListener('click', showLogboek);
    document.getElementById('resetBtn').addEventListener('click', function(){
      var box = document.getElementById('resetConfirm');
      box.hidden = false;
      box.innerHTML = '<p style="color:var(--rejected); font-size:.85rem; margin-top:10px;">Weet je het zeker? Alle STAR/WAIT/REMOVE-keuzes worden gewist.</p>' +
        '<div class="panel-actions"><button class="btn primary" id="confirmReset" type="button">Ja, wis alles</button>' +
        '<button class="btn ghost" id="cancelReset" type="button">Annuleren</button></div>';
      document.getElementById('confirmReset').addEventListener('click', function(){
        decisions = {};
        saveDecisions(decisions);
        state.stack = buildInitialStack();
        state.history = [];
        state.lapSeen = {};
        state.flipped = false;
        state.mode = 'stack';
        render();
      });
      document.getElementById('cancelReset').addEventListener('click', function(){ box.hidden = true; box.innerHTML=''; });
    });
    render();
  }

  // ---------- drag ----------
  var drag = null;
  function onPointerDown(e){
    if(state.mode !== 'stack' || state.stack.length === 0) return;
    if(e.target.closest && e.target.closest('a, button')) return;
    drag = { startX: e.clientX, startY: e.clientY, dx:0, dy:0, moved:false, id: e.pointerId };
    try{ el.cardDrag.setPointerCapture(e.pointerId); }catch(err){}
  }
  function onPointerMove(e){
    if(!drag) return;
    drag.dx = e.clientX - drag.startX;
    drag.dy = e.clientY - drag.startY;
    if(Math.abs(drag.dx) > 4 || Math.abs(drag.dy) > 4) drag.moved = true;
    var rot = drag.dx / 18;
    el.cardDrag.style.transition = 'none';
    el.cardDrag.style.transform = 'translate(' + drag.dx + 'px,' + Math.max(drag.dy,0) + 'px) rotate(' + rot + 'deg)';
  }
  function onPointerUp(e){
    if(!drag) return;
    var dx = drag.dx, dy = drag.dy, moved = drag.moved;
    drag = null;
    el.cardDrag.style.transition = '';
    var THRESH = 90;
    if(!moved){
      el.cardDrag.style.transform = '';
      flip();
      return;
    }
    if(dy > THRESH && Math.abs(dy) > Math.abs(dx)){
      flingOut(0, 400, function(){ decide('WAIT'); });
    } else if(dx > THRESH){
      flingOut(500, dy*0.4, function(){ decide('STAR'); });
    } else if(dx < -THRESH){
      flingOut(-500, dy*0.4, function(){ decide('REMOVE'); });
    } else {
      el.cardDrag.style.transform = '';
    }
  }
  function flingOut(x, y, cb){
    el.cardDrag.style.transition = 'transform .28s ease-in';
    el.cardDrag.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + (x/12) + 'deg)';
    setTimeout(function(){
      el.cardDrag.style.transition = '';
      el.cardDrag.style.transform = '';
      cb();
    }, 220);
  }

  el.cardDrag.addEventListener('pointerdown', onPointerDown);
  el.cardDrag.addEventListener('pointermove', onPointerMove);
  el.cardDrag.addEventListener('pointerup', onPointerUp);
  el.cardDrag.addEventListener('pointercancel', function(){ drag = null; el.cardDrag.style.transform=''; });

  // ---------- keyboard ----------
  var REASON_KEYS = ['al_bekend','niet_mijn_thema','te_zwak_bewijs','te_oud','verkeerde_vorm','anders'];
  document.addEventListener('keydown', function(e){
    if(state.mode === 'reason'){
      var inText = e.target === el.reasonComment;
      if(e.key === 'Escape'){ e.preventDefault(); cancelNote(); }
      else if(e.key === 'Enter' && (!inText || e.metaKey || e.ctrlKey)){ e.preventDefault(); saveNote(); }
      else if(!inText && e.key >= '1' && e.key <= '6'){ e.preventDefault(); pickReason(REASON_KEYS[Number(e.key)-1]); }
      return;
    }
    if(state.mode === 'logboek'){
      if(e.key === 'Escape'){ e.preventDefault(); sluitLogboek(); }
      return;
    }
    if(state.mode === 'routeren'){
      var inInstr = e.target && e.target.id === 'routeInstructie';
      if(e.key === 'Escape'){ e.preventDefault(); sluitRoute(); return; }
      if(e.key === 'Enter' && (!inInstr || e.metaKey || e.ctrlKey)){ e.preventDefault(); routeNext(); return; }
      if(inInstr) return;
      if(e.key === 'ArrowRight'){ e.preventDefault(); routeNext(); return; }
      if(e.key === 'ArrowLeft'){ e.preventDefault(); routePrev(); return; }
      var dest = BESTEMMINGEN.filter(function(b){ return b.toets === e.key; })[0];
      if(dest){ e.preventDefault(); toggleDest(dest.id); return; }
      var vorm = SOCIAL_VORMEN.filter(function(v){ return v.toets === e.key.toLowerCase(); })[0];
      if(vorm){ e.preventDefault(); pickSocial(vorm.id); }
      return;
    }
    if(state.mode === 'wachtrij'){
      if(e.key === 'Escape'){ e.preventDefault(); sluitWachtrij(); }
      return;
    }
    if(state.mode === 'leerverslag'){
      if(e.key === 'Enter'){ e.preventDefault(); antwoordLeerverslag(true, null); }
      else if(e.key === 'Escape'){ e.preventDefault(); openLeerNote(); }
      return;
    }
    if(e.key === 'c' || e.key === 'C'){ e.preventDefault(); openNote(); return; }
    if(e.key === 'n' || e.key === 'N'){ e.preventDefault(); decide('STAR', { nieuwsbrief: true }); return; }
    if(e.key === 'm' || e.key === 'M'){ e.preventDefault(); meerZoalsDit(); return; }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); decide('REMOVE'); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); decide('STAR'); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); decide('WAIT'); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); flip(); }
    else if(e.key === 'u' || e.key === 'U'){ e.preventDefault(); undo(); }
  });

  // ---------- buttons ----------
  el.btnRemove.addEventListener('click', function(){ decide('REMOVE'); });
  el.btnNote.addEventListener('click', openNote);
  el.btnWait.addEventListener('click', function(){ decide('WAIT'); });
  el.btnStar.addEventListener('click', function(){ decide('STAR'); });
  el.btnNews.addEventListener('click', function(){ decide('STAR', { nieuwsbrief: true }); });
  el.btnFlip.addEventListener('click', flip);
  el.btnUndo.addEventListener('click', undo);
  el.pauseBtn.addEventListener('click', function(){ showSummary(true); });
  el.reasonGrid.addEventListener('click', function(e){
    var b = e.target.closest('.reason-btn');
    if(b) pickReason(b.getAttribute('data-reason'));
  });
  el.reasonConfirm.addEventListener('click', saveNote);
  el.reasonCancel.addEventListener('click', cancelNote);
  el.logboekBtn.addEventListener('click', showLogboek);
  el.queueBtn.addEventListener('click', function(){ showWachtrij(state.mode); });
  el.faceBack.addEventListener('click', function(e){
    var b = e.target.closest('#btnMeer');
    if(b){ e.stopPropagation(); meerZoalsDit(); }
  });

  render();
  initDb();
})();
</script>
